<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AL-XIKMA SYSTEM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin: 5px; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

<h1>🔥 AL-XIKMA SYSTEM</h1>

<div id="authSection">
  <button onclick="loginGoogle()">Login with Google</button>
  <button onclick="loginEmail()">Login Email</button>
  <button onclick="registerEmail()">Register</button>
</div>

<div id="appSection" style="display:none;">
  <h2 id="userEmail"></h2>
  <h3 id="userRole"></h3>

  <p id="features"></p>

  <button onclick="logout()">Logout</button>

  <div id="adminPanel" style="display:none;">
    <h3>⚙️ Admin Panel</h3>
    <button onclick="changeRole()">Change User Role</button>
  </div>
</div>

<script>
  // 🔥 FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyB_ZgWHivBz_Z-_KbNiGrtTGU3R1Dtq7gw",
    authDomain: "alxikma-xisaabaad.firebaseapp.com",
    projectId: "alxikma-xisaabaad",
    storageBucket: "alxikma-xisaabaad.firebasestorage.app",
    messagingSenderId: "842183507563",
    appId: "1:842183507563:web:f197771bb6924a7ae07b2e"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  let currentUser = null;
  let currentRole = null;

  // 🔄 AUTH STATE
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;

      document.getElementById("authSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";

      document.getElementById("userEmail").innerText = "Welcome " + user.email;

      const ref = db.collection("users").doc(user.uid);
      const snap = await ref.get();

      if (snap.exists) {
        currentRole = snap.data().role;
      } else {
        await ref.set({
          email: user.email,
          role: "viewer",
          createdAt: new Date()
        });
        currentRole = "viewer";
      }

      document.getElementById("userRole").innerText = "Role: " + currentRole;

      showFeatures();
    } else {
      currentUser = null;
      document.getElementById("authSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
    }
  });

  // 🔐 GOOGLE LOGIN
  function loginGoogle() {
    auth.signInWithPopup(provider);
  }

  // 🔐 EMAIL LOGIN
  function loginEmail() {
    const email = prompt("Email");
    const password = prompt("Password");
    auth.signInWithEmailAndPassword(email, password);
  }

  // 🔐 REGISTER
  function registerEmail() {
    const email = prompt("Email");
    const password = prompt("Password");

    auth.createUserWithEmailAndPassword(email, password)
      .then(async (res) => {
        await db.collection("users").doc(res.user.uid).set({
          email,
          role: "viewer",
          createdAt: new Date()
        });
      });
  }

  // 🚪 LOGOUT
  function logout() {
    auth.signOut();
  }

  // ⚙️ CHANGE ROLE (ADMIN ONLY)
  function changeRole() {
    if (currentRole !== "admin") return alert("Only admin allowed");

    const uid = prompt("User UID");
    const role = prompt("Role (viewer/editor/admin)");

    db.collection("users").doc(uid).update({
      role: role
    });

    alert("Role updated");
  }

  // 📊 FEATURES
  function showFeatures() {
    let text = "";

    if (currentRole === "admin") {
      text = "🟢 Full system control";
      document.getElementById("adminPanel").style.display = "block";
    } else if (currentRole === "editor") {
      text = "🟡 Can edit data";
    } else {
      text = "🔵 View only";
    }

    document.getElementById("features").innerText = text;
  }

</script>

</body>
</html>
