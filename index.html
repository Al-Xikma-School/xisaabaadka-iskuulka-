                  const isMe = u.id === currentUser.id;
                  return (
                    <tr key={u.id} style={{ borderBottom:"1px solid #f8fafc", opacity: u.active?1:.5 }}>
                      <td style={{ padding:"11px 14px", fontWeight:700, color:"#1e293b" }}>{u.name} {isMe && <span style={{ fontSize:10, background:"#eff6ff", color:"#1d4ed8", padding:"1px 6px", borderRadius:8, marginLeft:4 }}>Adiga</span>}</td>
                      <td style={{ padding:"11px 14px", color:"#64748b", fontFamily:"monospace", fontSize:13 }}>{u.username}</td>
                      <td style={{ padding:"11px 14px" }}>
                        <select value={u.role} onChange={e => changeRole(u.id, e.target.value)} disabled={isMe}
                          style={{ padding:"4px 8px", background:rc.bg, color:rc.color, border:`1px solid ${rc.color}44`, borderRadius:8, fontSize:12, fontWeight:700, cursor: isMe?"not-allowed":"pointer", outline:"none" }}>
                          <option value="admin">🔴 Admin</option>
                          <option value="editor">🟡 Editor</option>
                          <option value="viewer">🟢 Viewer</option>
                        </select>
                      </td>
                      <td style={{ padding:"11px 14px", fontSize:13, color:"#64748b" }}>{school?.name||"Dhammaan"}</td>
                      <td style={{ padding:"11px 14px" }}>
                        <span style={{ padding:"3px 10px", background: u.active?"#f0fdf4":"#f1f5f9", color: u.active?"#166534":"#64748b", borderRadius:20, fontSize:11, fontWeight:700 }}>
                          {u.active?"✅ Firfircoon":"⛔ Xidhan"}
                        </span>
                      </td>
                      <td style={{ padding:"11px 14px" }}>
                        <button onClick={()=>toggleActive(u.id)} disabled={isMe}
                          style={{ padding:"5px 12px", background: u.active?"#fef2f2":"#f0fdf4", color: u.active?"#991b1b":"#166534", border:"none", borderRadius:6, cursor: isMe?"not-allowed":"pointer", fontSize:12, fontWeight:600, opacity: isMe?.5:1 }}>
                          {u.active?"⛔ Xidh":"✅ Fur"}
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  SETTINGS
    // ══════════════════════════════════════════════════════════
    function SettingsPage({ settings, setSettings, notify, currentUser, setUsers, users }) {
      const [form,   setForm]   = useState(settings);
      const [pwForm, setPwForm] = useState({ username:"", oldPw:"", newPw:"", confirmPw:"" });

      // Sync form when settings prop changes (e.g. after Firebase loads)
      useEffect(() => { setForm(settings); }, [JSON.stringify(settings)]);

      const handleSaveSettings = () => { setSettings(form); notify("Goobaha waa la kaydiyey ✅"); };

      const handleChangePw = () => {
        const u = users.find(x => x.username === pwForm.username);
        if (!u) return notify("Username ma jiro","error");
        if (u.password !== pwForm.oldPw) return notify("Furaha hore khaldan","error");
        if (pwForm.newPw !== pwForm.confirmPw) return notify("Furaha cusub is ma waafaqaan","error");
        if (pwForm.newPw.length < 4) return notify("Furaha waa inuu 4+ xaraf yahay","error");
        setUsers(prev => prev.map(x => x.username===pwForm.username ? {...x, password:pwForm.newPw} : x));
        setPwForm({ username:"", oldPw:"", newPw:"", confirmPw:"" });
        notify("Furaha waa la bedelay ✅");
      };

      const clearData = () => {
        if (!window.confirm("Xogta oo dhan tirtir? Tani ma soo noqon karto!")) return;
        localStorage.clear();
        // Tirtir Firebase xogta
        if (window._fbDb) {
          ["app/schools","app/users","app/transactions","app/limits","app/settings"].forEach(p => {
            window._fbSet(window._fbRef(window._fbDb, p), null).catch(()=>{});
          });
        }
        window.location.reload();
      };

      return (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
          {/* General */}
          <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
            <div style={{ padding:"14px 22px", background:"#f8fafc", borderBottom:"1px solid #e5e7eb" }}>
              <h3 style={{ margin:0, fontSize:14, fontWeight:800, color:"#1e293b" }}>⚙️ Goobaha Guud</h3>
            </div>
            <div style={{ padding:22 }}>
              {[
                { label:"Lacagta", key:"currency", type:"select", opts:["SOS","USD","EUR","GBP"] },
                { label:"Luqadda", key:"language", type:"select", opts:["Somali","English","Arabic"] },
                { label:"Magaca Hay'adda", key:"orgName", type:"text" },
                { label:"Sanadka Maaliyadeed", key:"fiscalYear", type:"text" },
              ].map(f => (
                <div key={f.key} style={{ marginBottom:16 }}>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:6 }}>{f.label}</label>
                  {f.type==="select"
                    ? <select value={form[f.key]||""} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))} style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }}>{f.opts.map(o=><option key={o}>{o}</option>)}</select>
                    : <input value={form[f.key]||""} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))} style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                  }
                </div>
              ))}
              <button onClick={handleSaveSettings} style={{ width:"100%", padding:"12px", background:"linear-gradient(135deg,#1a6b3c,#2ecc71)", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800, fontSize:15 }}>💾 Kaydi Goobaha</button>
            </div>
          </div>

          {/* Password */}
          <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
            <div style={{ padding:"14px 22px", background:"#f8fafc", borderBottom:"1px solid #e5e7eb" }}>
              <h3 style={{ margin:0, fontSize:14, fontWeight:800, color:"#1e293b" }}>🔒 Beddel Furaha</h3>
            </div>
            <div style={{ padding:22 }}>
              {[["username","Username","text"],["oldPw","Furaha Hore","password"],["newPw","Furahа Cusub","password"],["confirmPw","Xaqiiji Furaha","password"]].map(([k,l,t])=>(
                <div key={k} style={{ marginBottom:14 }}>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:6 }}>{l}</label>
                  <input type={t} value={pwForm[k]} onChange={e=>setPwForm(p=>({...p,[k]:e.target.value}))} placeholder="..."
                    style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                </div>
              ))}
              <button onClick={handleChangePw} style={{ width:"100%", padding:"12px", background:"#7c3aed", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800, fontSize:15 }}>🔑 Beddel Furaha</button>
            </div>
          </div>

          {/* App Info + Danger */}
          <div style={{ background:"linear-gradient(135deg,#0f172a,#1e293b)", borderRadius:14, padding:24, gridColumn:"span 2" }}>
            <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:20 }}>
              <div style={{ width:56, height:56, background:"linear-gradient(135deg,#1a6b3c,#2ecc71)", borderRadius:14, display:"flex", alignItems:"center", justifyContent:"center", fontSize:28 }}>📚</div>
              <div>
                <h2 style={{ margin:0, color:"#fff", fontWeight:900 }}>EduAccounts Pro</h2>
                <p style={{ margin:"4px 0 0", color:"#64748b", fontSize:13 }}>Nidaamka Xisaabta Iskuulka · Firebase Edition · v2.0</p>
              </div>
              <div style={{ marginLeft:"auto", textAlign:"right" }}>
                <div style={{ color:"#f59e0b", fontWeight:700, fontSize:13 }}>🔥 Firebase</div>
                <div style={{ color:"#64748b", fontSize:12 }}>Xogtu cloud-ka ku jirto</div>
              </div>
            </div>
            <div style={{ background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:10, padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ color:"#f87171", fontWeight:700, fontSize:13 }}>⚠️ Tirtir Xogta Oo Dhan</div>
                <div style={{ color:"#94a3b8", fontSize:12, marginTop:3 }}>Tani waxay tirtirtaa transactions, iskuullada, iyo users-ka oo dhan</div>
              </div>
              <button onClick={clearData} style={{ padding:"9px 18px", background:"#dc2626", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800, fontSize:13, whiteSpace:"nowrap" }}>🗑️ Tirtir Xogta</button>
            </div>
          </div>
        </div>
      );
    }

    // ── Render ────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    });
    window._installPWA = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    };
  </script>
</body>
</html>
