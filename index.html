<h2>Supabase Test</h2>

<button onclick="saveData()">Save Online</button>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const supabase = createClient(
    'https://wpeffyylavcxifcgwxyr.supabase.co',
    'sb_publishable_e5JVnUsWJTHcvep4lbM_LA_Lg8pWND2'
  )

  async function saveData() {
    const { error } = await supabase
      .from('xisaab_xirka')
      .insert([{ bisha: "Test", data: { hello: "world" } }])

    if (error) {
      alert("Error")
      console.log(error)
    } else {
      alert("Saved ✅")
    }
  }

  window.saveData = saveData
</script>

</body>
