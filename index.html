<style>
  :root{
    --navy:#0a1628;--navy2:#1a3a5c;--navy3:#1e2a3a;
    --gold:#ffd700;--gold2:#ff8c00;
    --green:#0d6e4f;--green2:#10b981;--green-light:#d1fae5;
    --blue:#1565c0;--blue2:#3b82f6;--blue-light:#dbeafe;
    --red:#c62828;--red2:#ef4444;--red-light:#fee2e2;
    --orange:#e65100;--bg:#f0f4f8;--white:#ffffff;
    --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
    --shadow-md:0 4px 16px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.07);
    --shadow-lg:0 10px 40px rgba(0,0,0,.15),0 4px 14px rgba(0,0,0,.1);
    --radius-sm:8px;--radius-md:14px;--radius-lg:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);min-height:100vh;color:#1e293b;}
  #fb-loading{display:none;position:fixed;top:0;left:0;right:0;z-index:10000;background:linear-gradient(90deg,var(--navy2),var(--blue2));color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;}
  #toast{display:none;position:fixed;top:20px;right:20px;z-index:9999;color:#fff;padding:14px 22px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:600;max-width:calc(100vw - 40px);animation:slideIn .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
  #modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,.6);backdrop-filter:blur(6px);z-index:9998;align-items:center;justify-content:center;padding:16px;}
  #modal-overlay.show{display:flex;}
  #modal-box{background:var(--white);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);animation:modalIn .3s cubic-bezier(.34,1.2,.64,1);}
  @keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  #modal-box h3{margin:0 0 10px;color:var(--navy2);font-size:17px;font-weight:700;}
  #modal-box p{color:#64748b;font-size:14px;margin-bottom:26px;line-height:1.5;}
  .modal-btns{display:flex;gap:12px;justify-content:flex-end;}
  .btn-cancel{padding:10px 22px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);background:#f8fafc;cursor:pointer;font-size:14px;font-weight:600;color:#64748b;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn-confirm{padding:10px 22px;border:none;border-radius:var(--radius-sm);color:#fff;cursor:pointer;font-size:14px;font-weight:700;transition:.2s;}
  #login-page{display:flex;min-height:100vh;background:var(--navy);align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden;}
  #login-page::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(21,101,192,.35) 0%,transparent 70%);top:-150px;right:-150px;pointer-events:none;}
  #login-page::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(13,110,79,.25) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none;}
  .login-box{background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:40px 32px;width:100%;max-width:420px;box-shadow:0 40px 80px rgba(0,0,0,.5);position:relative;z-index:1;}
  .login-logo{text-align:center;margin-bottom:28px;}
  .login-school-logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid rgba(255,215,0,.5);box-shadow:0 0 30px rgba(255,215,0,.2),0 4px 20px rgba(0,0,0,.4);}
  .login-box h1{color:var(--gold);font-size:22px;font-weight:800;text-align:center;letter-spacing:.5px;}
  .login-box p{color:rgba(255,255,255,.45);font-size:13px;text-align:center;margin-top:6px;}
  .login-label{color:rgba(255,255,255,.65);font-size:11px;font-weight:700;display:block;margin-bottom:7px;margin-top:16px;letter-spacing:.5px;text-transform:uppercase;}
  .login-input{width:100%;padding:13px 16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:11px;color:#fff;font-size:15px;outline:none;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .login-input:focus{border-color:rgba(255,215,0,.5);background:rgba(255,255,255,.1);}
  .login-input::placeholder{color:rgba(255,255,255,.3);}
  #login-err{color:#fca5a5;font-size:13px;margin:8px 0 0;display:none;font-weight:600;}
  .btn-login{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:11px;color:#1a1a1a;font-weight:800;font-size:16px;cursor:pointer;margin-top:14px;margin-bottom:22px;letter-spacing:.3px;box-shadow:0 4px 20px rgba(255,215,0,.3);transition:.25s;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(255,215,0,.4);}
  .show-pwd-btn{background:none;border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.45);font-size:12px;border-radius:7px;padding:7px 14px;cursor:pointer;width:100%;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;}
  #pwd-list{display:none;margin-top:12px;background:rgba(0,0,0,.35);border-radius:10px;padding:14px;}
  .pwd-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;}
  .pwd-row span:first-child{color:var(--gold);font-weight:700;}
  .pwd-row span:last-child{color:rgba(255,255,255,.45);}
  #app-page{display:none;flex-direction:column;min-height:100vh;max-height:100vh;overflow:hidden;}
  #app-page.show{display:flex;}
  #header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;box-shadow:0 2px 20px rgba(0,0,0,.35);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,215,0,.55);box-shadow:0 0 12px rgba(255,215,0,.15);}
  .header-title{color:var(--gold);font-weight:800;font-size:16px;letter-spacing:.5px;font-family:'Space Grotesk',sans-serif;}
  .header-sub{color:rgba(255,255,255,.35);font-size:12px;margin-left:6px;font-weight:500;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .bisha-label{color:rgba(255,255,255,.55);font-size:12px;font-weight:600;}
  #bisha-select{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:var(--gold);border-radius:8px;padding:5px 10px;font-size:12px;outline:none;cursor:pointer;max-width:110px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;}
  #bisha-select option{background:#1a3a5c;}
  .header-user{color:rgba(255,255,255,.65);font-size:12px;font-weight:600;}
  .btn-bax{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);padding:6px 13px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  #main-layout{display:flex;flex:1;overflow:hidden;}
  #sidebar{width:220px;background:var(--navy3);padding:18px 12px;overflow-y:auto;flex-shrink:0;border-right:1px solid rgba(255,255,255,.05);}
  .sb-section-lbl{color:rgba(255,255,255,.35);font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;padding:0 8px;font-weight:700;}
  .sb-divider{border-top:1px solid rgba(255,255,255,.08);margin:10px 0;padding-top:10px;}
  .sb-farac-btn{width:100%;padding:10px 12px;background:transparent;border:none;border-radius:10px;color:rgba(255,255,255,.75);text-align:left;cursor:pointer;margin-bottom:4px;font-size:13px;display:flex;align-items:center;justify-content:space-between;transition:.2s;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif;}
  .sb-farac-btn:hover{background:rgba(255,255,255,.07);}
  .sb-farac-btn.active-sare{background:linear-gradient(135deg,rgba(13,110,79,.7),rgba(13,110,79,.4));color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(13,110,79,.3);}
  .sb-farac-btn.active-dhexe{background:linear-gradient(135deg,rgba(123,63,0,.7),rgba(123,63,0,.4));color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(123,63,0,.3);}
  .sb-farac-btn.active-hoose1{background:linear-gradient(135deg,rgba(74,26,107,.7),rgba(74,26,107,.4));color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(74,26,107,.3);}
  .sb-farac-btn.active-hoose2{background:linear-gradient(135deg,rgba(139,26,42,.7),rgba(139,26,42,.4));color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(139,26,42,.3);}
  .sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .sb-tab-btn{width:100%;padding:8px 12px;background:transparent;border:none;border-radius:8px;color:rgba(255,255,255,.45);text-align:left;cursor:pointer;font-size:13px;margin-bottom:3px;white-space:nowrap;transition:.2s;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif;}
  .sb-tab-btn:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.05);}
  .sb-tab-btn.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;}
  .sb-guud-btn{width:100%;padding:10px 12px;background:transparent;border:none;border-radius:10px;color:rgba(255,255,255,.75);text-align:left;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .sb-guud-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a1a;box-shadow:0 4px 14px rgba(255,215,0,.3);}
  .sb-farac-badge{background:#0d6e4f;color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;}
  #main-content{flex:1;overflow-y:auto;padding:22px;background:var(--bg);}
  .stat-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  .stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--white);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.25s;border:1px solid rgba(0,0,0,.05);}
  .stat-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px;border-radius:var(--radius-md) 0 0 var(--radius-md);}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .stat-card-lg{padding:22px 20px;}
  .stat-card-lbl{color:#94a3b8;font-size:10px;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
  .stat-card-val{font-weight:800;font-size:24px;font-family:'Space Grotesk',sans-serif;}
  .stat-card-val.small{font-size:16px;font-weight:700;}
  .stat-card-icon{font-size:28px;opacity:.85;}
  .stat-card-icon.small{font-size:20px;}
  .stat-card-inner{display:flex;justify-content:space-between;align-items:center;}
  .mini-stat{background:#f8fafc;border-radius:9px;padding:9px 12px;border:1px solid #f1f5f9;}
  .mini-stat-lbl{color:#94a3b8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .mini-stat-val{font-weight:700;color:#334155;font-size:14px;margin-top:3px;font-family:'Space Grotesk',sans-serif;}
  .info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9;}
  .info-row span:first-child{color:#64748b;font-size:13px;font-weight:500;}
  .info-row span:last-child{font-weight:700;font-size:13px;color:#1e293b;font-family:'Space Grotesk',sans-serif;}
  .panel{background:var(--white);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;border:1px solid rgba(0,0,0,.04);}
  .panel h4{margin:0 0 16px;color:var(--navy2);font-size:15px;font-weight:700;}
  .panel-header{background:linear-gradient(135deg,var(--navy3),var(--navy2));color:#fff;padding:14px 20px;font-weight:700;display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.2px;}
  .tbl-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid #e2e8f0;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{padding:10px 8px;text-align:center;font-weight:700;color:#475569;font-size:11px;border-bottom:2px solid #e2e8f0;white-space:nowrap;background:#f8fafc;letter-spacing:.3px;text-transform:uppercase;}
  td{padding:8px 7px;text-align:center;color:#334155;border-bottom:1px solid #f1f5f9;}
  tr:hover td{background:#f8fafc;}
  tfoot tr{background:#f1f5f9;font-weight:800;}
  .inp-cell{width:70px;padding:5px 6px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:11px;text-align:center;background:#fff;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .inp-cell:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .inp-cell:disabled{background:#f8fafc;color:#cbd5e1;border-color:#f1f5f9;}
  .th-green{background:#ecfdf5!important;color:#065f46!important;font-weight:800!important;}
  .th-blue{background:#eff6ff!important;color:#1d4ed8!important;font-weight:800!important;}
  .td-green{color:#059669!important;font-weight:700!important;}
  .td-blue{color:#2563eb!important;font-weight:700!important;}
  .td-red{color:#dc2626!important;font-weight:700!important;}
  .td-green-bg{background:#ecfdf5;font-weight:800;color:#059669;font-size:13px;font-family:'Space Grotesk',sans-serif;}
  .td-blue-bg{background:#eff6ff;font-weight:800;color:#2563eb;font-size:13px;font-family:'Space Grotesk',sans-serif;}
  .tfoot-total-arday{background:#d1fae5!important;color:#065f46!important;font-size:14px!important;font-weight:800!important;font-family:'Space Grotesk',sans-serif;}
  .tfoot-total-lacag{background:#dbeafe!important;color:#1d4ed8!important;font-size:14px!important;font-weight:800!important;font-family:'Space Grotesk',sans-serif;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .farac-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--white);padding:16px 20px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.04);}
  .farac-title{display:flex;align-items:center;gap:12px;}
  .farac-bar{width:5px;height:36px;border-radius:4px;}
  .action-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn-save{padding:8px 18px;background:#fff;border:2px solid var(--blue);border-radius:9px;color:var(--blue);cursor:pointer;font-size:13px;font-weight:700;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn-gudbi{padding:8px 18px;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 3px 12px rgba(21,101,192,.3);transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn-unlock{padding:8px 16px;background:#fff7ed;border:1.5px solid #fb923c;border-radius:9px;color:#ea580c;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .badge-submitted{background:#ecfdf5;color:#059669;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid #a7f3d0;}
  .alert-locked{background:#fff7ed;border:1.5px solid #fb923c;border-radius:10px;padding:10px 16px;margin-bottom:16px;color:#ea580c;font-size:13px;font-weight:600;}
  .alert-saved{background:#eff6ff;border-radius:8px;padding:6px 14px;margin-bottom:14px;color:#2563eb;font-size:12px;font-weight:600;}

  .kharash-lbl{color:#475569;font-size:14px;font-weight:600;}

  .kharash-inp:disabled{background:#f8fafc;color:#cbd5e1;}
  .discount-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f5f9;}
  .discount-inp{width:100px;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:13px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:600;transition:.2s;}
  .discount-inp:disabled{background:#f8fafc;}
  .farac-overview-card{background:var(--white);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.04);position:relative;overflow:hidden;transition:.25s;}

function getFbPath(bisha){ return `xisaab/${bisha.replace(/\s/g,"_")}`; }
const BISHA_FB_PATH = "meta/bisha";
const USERS_FB_PATH = "meta/users";
const SETTINGS_FB_PATH = "meta/settings";

let _activeListener = null;

async function fbSet(path, value){
  await window._fbSet(window._fbRef(window._fbDb, path), value);
}
async function fbGetOnce(path){
  const snap = await window._fbGet(window._fbRef(window._fbDb, path));
  return snap.exists() ? snap.val() : null;
}
function startListener(bisha){
  if(_activeListener){ _activeListener(); _activeListener=null; }
  const dbRef = window._fbRef(window._fbDb, getFbPath(bisha));
  _activeListener = window._fbOnValue(dbRef, (snapshot)=>{
    const incoming = snapshot.val();
    if(incoming && typeof incoming==="object"){
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!incoming[k]) incoming[k]=buildInitFarac()[k]; });
      appData = incoming;
    } else {
      appData = buildInitFarac();
    }
    if(currentUser) renderAll();
  });
}

const DEFAULT_FASALADA = {
  sare:  ["Level One","Level Two"],
  dhexe: ["1aad","2aad","3aad"],
  hoose1:["Fasalka 1","Fasalka 2","Fasalka 3"],
  hoose2:["Fasalka 4","Fasalka 5","Basaska"],
};

  scholarship:"Scholarship", freeStudents:"Free Students",
  ardaydaCusub:"Ardayda Cusub", ardaydaBaxday:"Ardayda Baxday"
};

  maamulka:"Maamulka", macalimiinta:"Macalimiinta", shaqaalaha:"Shaqaalaha",
  canshuurta:"Canshuurta", dareewalada:"Dareewalada", kharashDugsiga:"Kharash Dugsiga"
};

// ══════════════════════════════════════════
// STATE

function L(key){ return (LUUQADAHA[currentLang]||LUUQADAHA.so)[key] || key; }

function emptyFasal(name, faracKey){
  const q = (defaultQiimaha && defaultQiimaha[faracKey]) ? defaultQiimaha[faracKey] : 13;
  return {magaca:name,tiradaBixisay:0,qiimaha:q,lacagtaSooHormartay:0,previewPayment:0,tiradaAanBixin:0,lacagtaAanBixin:0,scholarship:0,freeStudents:0,ardaydaCusub:0,ardaydaBaxday:0};
}
function buildInitFarac(){
  const d={};
  Object.keys(DEFAULT_FASALADA).forEach(k=>{
    d[k]={fasalada:DEFAULT_FASALADA[k].map(n=>emptyFasal(n,k)),kharash:{maamulka:0,macalimiinta:0,shaqaalaha:0,canshuurta:0,dareewalada:0,kharashDugsiga:0},discount:0,lacagKhususi:0,submitted:false,savedAt:null};
  });
  return d;
}
function calcFarac(fd){
  let tB=0,tL=0,tH=0,tP=0,tAB=0,tLAB=0,tS=0,tF=0,tCusub=0,tBaxday=0;
  fd.fasalada.forEach(f=>{
    tB +=+f.tiradaBixisay; tL +=+f.tiradaBixisay * +f.qiimaha;
    tH +=+f.lacagtaSooHormartay; tP +=+f.previewPayment;
    tAB+=+f.tiradaAanBixin; tLAB+=+f.lacagtaAanBixin;
    tS +=+f.scholarship; tF +=+f.freeStudents;
    tCusub+=+(f.ardaydaCusub||0); tBaxday+=+(f.ardaydaBaxday||0);
  });
  const kWadar=Object.values(fd.kharash).reduce((a,b)=>a+(+b),0);
  const xarooday=tL+tH+tP;
  const saafi=xarooday-(+fd.discount)-(+fd.lacagKhususi);
  // ardaydaCusub ku biirto totalka, ardaydaBaxday kuma biirto
  const totalArdayda=tB+tAB+tS+tF+tCusub;
  return {totalBixisay:tB,totalLacag:tL,totalHormartay:tH,totalPreview:tP,totalAanBixin:tAB,totalLacagAanBixin:tLAB,totalScholarship:tS,totalFree:tF,totalCusub:tCusub,totalBaxday:tBaxday,kharashWadar:kWadar,xarooday,saafi,totalArdayda};
}

// ══════════════════════════════════════════
// FIREBASE LOAD/SAVE
// ══════════════════════════════════════════
function setFbLoading(on){
  const el=document.getElementById("fb-loading");
  el.textContent = L("lbl_loading");
  el.style.display=on?"block":"none";
}

async function loadBisha(targetBisha){
  setFbLoading(true);
  try{
    const snap = await fbGetOnce(getFbPath(targetBisha));
    if(snap && typeof snap==="object"){
      appData = snap;
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!appData[k]) appData[k]=buildInitFarac()[k]; });
    } else { appData=buildInitFarac(); }
  }catch(e){ appData=buildInitFarac(); }
  finally{ setFbLoading(false); }
  startListener(targetBisha);
}

let saveTimeout = null;
function scheduleSave(){
  if(saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async()=>{
    try{ await fbSet(getFbPath(currentBisha), appData); }catch{}
  }, 800);
}

async function handleBishaChange(bisha){
  try{ await fbSet(getFbPath(currentBisha), appData); }catch{}
  currentBisha = bisha;
  try{ await fbSet(BISHA_FB_PATH, bisha); }catch{}
  await loadBisha(bisha);
  renderAll();
}

// ══════════════════════════════════════════
// SAVE/LOAD USERS & SETTINGS TO FIREBASE
// ══════════════════════════════════════════
async function saveUsersToFb(){
  try{ await fbSet(USERS_FB_PATH, USERS); }catch{}
}
async function saveSettingsToFb(){
  try{ await fbSet(SETTINGS_FB_PATH, {lang: currentLang, qiimaha: defaultQiimaha}); }catch{}
}
async function loadUsersAndSettings(){
  try{
    const savedUsers = await fbGetOnce(USERS_FB_PATH);
    if(savedUsers && typeof savedUsers==="object") USERS = savedUsers;
    const savedSettings = await fbGetOnce(SETTINGS_FB_PATH);
    if(savedSettings){
      if(savedSettings.lang) currentLang = savedSettings.lang;
      if(savedSettings.qiimaha) defaultQiimaha = savedSettings.qiimaha;
    }
  }catch{}
}

// ══════════════════════════════════════════
// LOGIN / LOGOUT
// ══════════════════════════════════════════
function doLogin(){
  const u = document.getElementById("inp-user").value.trim().toLowerCase();
  const p = document.getElementById("inp-pass").value;
  const usr = USERS[u];
  if(usr && usr.password===p){
    currentUser = {...usr, username:u};
    document.getElementById("login-err").style.display="none";
    activeFarac = usr.role!=="maamul" ? usr.role : "sare";
    activeTab = "xisaab";
    document.getElementById("login-page").style.display="none";
    document.getElementById("app-page").classList.add("show");
    document.getElementById("header-user-label").textContent = "👤 "+(usr.label||u);
    resetSessionTimer();
    renderAll();
  } else {
    document.getElementById("login-err").style.display="block";
  }
}
function doLogout(){
  clearTimeout(sessionTimer);
  currentUser=null; activeFarac=null; activeTab="xisaab";
  document.getElementById("app-page").classList.remove("show");
  document.getElementById("login-page").style.display="flex";
  document.getElementById("inp-user").value="";
  document.getElementById("inp-pass").value="";
  applyLangToLogin();
}
// ── PASSWORD SHOW/HIDE ────────────────────
function togglePassView(){
  const inp = document.getElementById("inp-pass");
  const btn = document.getElementById("btn-pass-eye");
  if(inp.type === "password"){
    inp.type = "text";
    btn.textContent = "🙈";
    btn.style.color = "rgba(255,215,0,.8)";
  } else {
    inp.type = "password";
    btn.textContent = "👁";
    btn.style.color = "rgba(255,255,255,.6)";
  }
}

// ── SESSION EXPIRY (10 daqiiqo maqnaansho) ──
const SESSION_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes
let sessionTimer = null;

function resetSessionTimer(){
  clearTimeout(sessionTimer);
  if(!currentUser) return;
  sessionTimer = setTimeout(()=>{
    if(currentUser){
      doLogout();
      // Small notice after logout
      const t = document.getElementById("toast");
      t.textContent = "⏰ Session waa dhacday. Fadlan dib u gal.";
      t.style.background = "#e65100";
      t.style.display = "block";
      setTimeout(()=>{ t.style.display="none"; }, 4000);
    }
  }, SESSION_TIMEOUT_MS);
}

// Listen for user activity to reset the timer
["mousemove","mousedown","keydown","touchstart","scroll","click"].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(currentUser) resetSessionTimer(); }, {passive:true});
});

function togglePwdList(){
  const el=document.getElementById("pwd-list");
  const btn=document.querySelector(".show-pwd-btn");
  pwdVisible=!pwdVisible;
  if(!pwdVisible){ el.style.display="none"; btn.textContent=L("btn_show_logins"); return; }
  el.style.display="block"; btn.textContent=L("btn_hide_logins");
  el.innerHTML = Object.entries(USERS).map(([k,v])=>
    `<div class="pwd-row"><span>${k}</span><span>${v.password}</span></div>`
  ).join("");
}

function applyLangToLogin(){
  const setT = (id,key)=>{ const el=document.getElementById(id); if(el) el.textContent=L(key); };
  setT("login-subtitle","login_subtitle");
  setT("lbl-username","lbl_username");
  setT("lbl-password","lbl_password");
  setT("btn-login-text","btn_login");
  setT("btn-show-logins","btn_show_logins");
  setT("lbl-bisha-header","lbl_bisha");
  setT("btn-bax-txt","btn_bax");
  document.getElementById("fb-loading").textContent = L("lbl_loading");
  document.getElementById("modal-confirm-btn").textContent = "";
}

// ══════════════════════════════════════════
// RENDER ALL
// ══════════════════════════════════════════
function renderAll(){
  applyLangToLogin();
  populateBishaSelect();
  renderSidebar();
  renderContent();
}

function populateBishaSelect(){
  const sel=document.getElementById("bisha-select");
  if(sel.options.length===0){
    BILAHA.forEach(b=>{ const o=document.createElement("option"); o.value=b; o.textContent=b; sel.appendChild(o); });
  }
  sel.value = currentBisha;
}

// ══════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════
function renderSidebar(){
  const isMaamul = currentUser.role==="maamul";
  const sb = document.getElementById("sidebar");
  let html="";
  if(isMaamul){
    html += `<div class="sb-section-lbl">${L("nav_faracyada")}</div>`;
    Object.keys(FARAC_COLORS).forEach(k=>{
      const activeClass = activeFarac===k ? `active-${k}` : "";
      html += `<button class="sb-farac-btn ${activeClass}" onclick="selectFarac('${k}')">
        <span style="display:flex;align-items:center;gap:7px"><span class="sb-dot" style="background:${FARAC_COLORS[k]}"></span>${FARAC_LABELS[k]}</span>
        ${appData[k]?.submitted?"<span style='font-size:10px'>✅</span>":""}
      </button>`;
    });
    html += `<div class="sb-divider sidebar-divider-block">
      <button class="sb-guud-btn ${activeFarac===null?"active":""}" onclick="selectGuud()">${L("nav_guud")}</button>
    </div>`;
    html += `<button class="sb-farac-btn ${activeFarac===null?"active-guud":""}" style="white-space:nowrap;flex-shrink:0" onclick="selectGuud()">${L("nav_guud_short")}</button>`;
  } else {
    html += `<div class="non-maamul-badge" style="background:${FARAC_COLORS[currentUser.role]}">
      <div class="label">${FARAC_LABELS[currentUser.role]}</div>
      ${appData[currentUser.role]?.submitted?`<div class="sub">✅ ${L("msg_submitted").replace("📤 ","")}</div>`:""}
    </div>`;
  }
  if(activeFarac){
    html += `<div style="border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:6px">
      <div class="sb-section-lbl">TABS</div>`;
    const tabs=[
      {id:"xisaab",label:L("tab_xisaab")},
      {id:"kharash",label:L("tab_kharash")},
      {id:"charts",label:L("tab_charts")}
    ];
    if(isMaamul) tabs.push({id:"settings",label:L("tab_settings")});
    tabs.forEach(t=>{ html+=`<button class="sb-tab-btn ${activeTab===t.id?"active":""}" onclick="selectTab('${t.id}')">${t.label}</button>`; });
    html+="</div>";
  }
  sb.innerHTML=html;
}

function selectFarac(k){ activeFarac=k; activeTab="xisaab"; renderAll(); }
function selectGuud(){ activeFarac=null; activeTab="guud"; renderAll(); }
function selectTab(t){ activeTab=t; renderContent(); renderSidebar(); }

// ══════════════════════════════════════════
// CONTENT
// ══════════════════════════════════════════
function renderContent(){
  destroyCharts();
  const isMaamul = currentUser.role==="maamul";
  const mc = document.getElementById("main-content");
  if(activeFarac===null && isMaamul){ mc.innerHTML=renderGuud(); initGuudCharts(); return; }
  if(activeFarac){ mc.innerHTML=renderFaracDetail(); if(activeTab==="charts") initFaracCharts(); return; }
  mc.innerHTML="";
}

// ── GUUD ──────────────────────────────────
function renderGuud(){
  const allStats = Object.keys(FARAC_COLORS).map(k=>({key:k,label:FARAC_LABELS[k],color:FARAC_COLORS[k],submitted:appData[k]?.submitted,...calcFarac(appData[k])}));
  const grand = allStats.reduce((a,s)=>({saafi:a.saafi+s.saafi,kharashWadar:a.kharashWadar+s.kharashWadar,totalArdayda:a.totalArdayda+s.totalArdayda}),{saafi:0,kharashWadar:0,totalArdayda:0});

  const totalProfit = grand.saafi - grand.kharashWadar;
  let html=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div>
      <h2 style="color:#0f172a;margin:0;font-size:20px;font-weight:800;font-family:'Space Grotesk',sans-serif">${L("lbl_warbixin")} <span style="color:var(--blue)">${currentBisha}</span></h2>
      <p style="color:#64748b;font-size:13px;margin-top:4px;font-weight:500">Warbixinta Xisaabta Guud — Dhammaan Faracyada</p>
    </div>
    <div style="background:${totalProfit>=0?'linear-gradient(135deg,#ecfdf5,#d1fae5)':'linear-gradient(135deg,#fef2f2,#fee2e2)'};border:1.5px solid ${totalProfit>=0?'#a7f3d0':'#fca5a5'};border-radius:12px;padding:10px 18px;text-align:right">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:${totalProfit>=0?'#065f46':'#991b1b'}">Faa'iido / Khasaare</div>
      <div style="font-size:22px;font-weight:800;color:${totalProfit>=0?'#059669':'#dc2626'};font-family:'Space Grotesk',sans-serif">$${totalProfit.toLocaleString()}</div>
    </div>
  </div>
  <div class="stat-grid-3">
    ${statCard(L("lbl_ardayda_wadar"),grand.totalArdayda,"👨‍🎓","#1a3a5c",false)}
    ${statCard(L("lbl_lacag_saafi"),"$"+grand.saafi.toLocaleString(),"💵","#0d6e4f",false)}
    ${statCard(L("lbl_kharash_guud"),"$"+grand.kharashWadar.toLocaleString(),"📤","#c62828",false)}
  </div>
  <div class="income-expense-wrap">
    <div class="ie-card income">
      <div class="ie-card-lbl">💰 Wadarta Dakhliga (Revenue)</div>
      <div class="ie-card-val">$${grand.saafi.toLocaleString()}</div>
      <div class="ie-card-sub">Lacagta saafi ee la aruuriyey ${currentBisha}</div>
    </div>
    <div class="ie-card expense">
      <div class="ie-card-lbl">📤 Wadarta Kharashka (Expenses)</div>
      <div class="ie-card-val">$${grand.kharashWadar.toLocaleString()}</div>
      <div class="ie-card-sub">Kharashka oo dhan — dhammaan faracyada</div>
    </div>
  </div>
  <div class="panel" style="margin-bottom:16px"><h4 style="margin-bottom:14px">📈 Barbardhig Faracyada — Dakhliga & Kharashka</h4><div class="chart-canvas-wrap"><canvas id="chart-guud-bar"></canvas></div></div>
  <div class="summary-grid">`;
  allStats.forEach(s=>{
    const profit = s.saafi - s.kharashWadar;
    html+=`<div class="farac-overview-card" style="--card-color:${s.color};border-top:4px solid ${s.color}">
      <div class="farac-ov-top">
        <div>
          <h3 style="color:${s.color};margin:0;font-size:15px;font-weight:800;font-family:'Space Grotesk',sans-serif">${s.label}</h3>
          <span style="color:#94a3b8;font-size:11px;font-weight:600">${s.totalArdayda} Arday</span>
        </div>
        <span style="display:flex;gap:6px;align-items:center">
          <span style="background:${s.color}22;color:${s.color};border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;border:1.5px solid ${s.color}44">👥 ${s.totalArdayda}</span>
          ${s.submitted?"<span style='background:#ecfdf5;color:#059669;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:800;border:1.5px solid #a7f3d0'>✅</span>":""}
        </span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-radius:10px;padding:10px 12px;">
          <div style="color:#065f46;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px">💰 Dakhliga</div>
          <div style="color:#059669;font-size:16px;font-weight:800;margin-top:3px;font-family:'Space Grotesk',sans-serif">$${s.saafi.toLocaleString()}</div>
        </div>
        <div style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border-radius:10px;padding:10px 12px;">
          <div style="color:#991b1b;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px">📤 Kharash</div>
          <div style="color:#dc2626;font-size:16px;font-weight:800;margin-top:3px;font-family:'Space Grotesk',sans-serif">$${s.kharashWadar.toLocaleString()}</div>
        </div>
        <div class="mini-stat"><div class="mini-stat-lbl">${L("lbl_xarooday")}</div><div class="mini-stat-val">$${s.xarooday.toLocaleString()}</div></div>
        <div class="mini-stat"><div class="mini-stat-lbl">⚠️ ${L("lbl_aan_bixin")}</div><div class="mini-stat-val" style="color:#dc2626">${s.totalAanBixin}</div></div>
      </div>
      <div class="farac-ov-footer ${profit>=0?"profit":"loss"}">
        <span style="font-size:12px;color:#64748b;font-weight:600">📈 Faa'iido / Khasaare</span>
        <span style="font-weight:800;color:${profit>=0?"#059669":"#dc2626"};font-size:15px;font-family:'Space Grotesk',sans-serif">${profit>=0?"▲":"▼"} $${Math.abs(profit).toLocaleString()}</span>
      </div>
      ${s.submitted?`<button class="btn-unlock-sm" onclick="unlockFarac('${s.key}')">🔓 Fur / Unlock</button>`:""}
    </div>`;
  });
  html+="</div>";
  return html;
}

function chartDefaults(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{labels:{font:{family:"'Plus Jakarta Sans',sans-serif",size:12,weight:'600'},padding:16,usePointStyle:true,pointStyle:'circle'}},
      tooltip:{backgroundColor:'rgba(15,23,42,.9)',titleFont:{family:"'Space Grotesk',sans-serif",size:13,weight:'700'},bodyFont:{family:"'Plus Jakarta Sans',sans-serif",size:12},padding:12,cornerRadius:10,displayColors:true,boxWidth:8,boxHeight:8}
    },
    scales:{
      x:{grid:{display:false},ticks:{font:{family:"'Plus Jakarta Sans',sans-serif",size:11,weight:'600'},color:'#64748b'},border:{display:false}},
      y:{grid:{color:'rgba(241,245,249,.8)',lineWidth:1.5},ticks:{font:{family:"'Plus Jakarta Sans',sans-serif",size:11},color:'#94a3b8'},border:{display:false}}
    }
  };
}
function initGuudCharts(){
  const allStats = Object.keys(FARAC_COLORS).map(k=>({label:FARAC_LABELS[k],color:FARAC_COLORS[k],...calcFarac(appData[k])}));
  const ctx = document.getElementById("chart-guud-bar");
  if(!ctx) return;
  const opts = chartDefaults();
  opts.scales.y.ticks.callback = v => `$${v.toLocaleString()}`;
  chartInstances["guud-bar"] = new Chart(ctx,{
    type:"bar",
    data:{
      labels:allStats.map(s=>s.label),
      datasets:[
        {label:"💰 Lacag Saafi",data:allStats.map(s=>s.saafi),backgroundColor:allStats.map(s=>s.color+'cc'),borderColor:allStats.map(s=>s.color),borderWidth:2,borderRadius:8,borderSkipped:false},
        {label:"📤 Kharash",data:allStats.map(s=>s.kharashWadar),backgroundColor:"rgba(198,40,40,.18)",borderColor:"rgba(198,40,40,.7)",borderWidth:2,borderRadius:8,borderSkipped:false},
      ]
    },
    options:opts
  });
}

// ── FARAC DETAIL ──────────────────────────
function renderFaracDetail(){
  const isMaamul = currentUser.role==="maamul";
  const fd = appData[activeFarac];
  const calc = calcFarac(fd);
  const isLocked = fd.submitted && !isMaamul;
  const color = FARAC_COLORS[activeFarac];

  let html=`
  <div class="farac-detail-header">
    <div class="farac-title">
      <div class="farac-bar" style="background:${color}"></div>
      <div>
        <h2 style="margin:0;color:#1a3a5c;font-size:17px">${FARAC_LABELS[activeFarac]}</h2>
        <span style="color:#888;font-size:11px">📅 ${currentBisha} ${new Date().getFullYear()}</span>
      </div>
    </div>
    <div class="action-btns">
      ${fd.submitted?"<span class='badge-submitted'>✅ La Gudbiyey</span>":""}
      ${!fd.submitted?`
        <button class="btn-save" onclick="saveDraft('${activeFarac}')">💾 Save</button>
        ${!isMaamul?`<button class="btn-gudbi" onclick="openSubmitModal('${activeFarac}')">📤 Gudbi</button>`:""}
      `:""}
      ${fd.submitted && isMaamul?`<button class="btn-unlock" onclick="unlockFarac('${activeFarac}')">🔓 Unlock</button>`:""}
    </div>
  </div>
  ${isLocked?`<div class="alert-locked">🔒 Xogtan waa la gudbiyey maamulka. Waxaad arki kartaa laakiin ma bedeli kartid.</div>`:""}
  ${fd.savedAt && !fd.submitted?`<div class="alert-saved">💾 Kaydsan: ${new Date(fd.savedAt).toLocaleString()}</div>`:""}

  <div class="stat-grid-5">
    ${statCard(L("lbl_ardayda_wadar"),calc.totalArdayda,"👥",color,true)}
    ${statCard(L("lbl_bixisay"),calc.totalBixisay,"✅","#0d6e4f",true)}
    ${statCard(L("lbl_xarooday"),"$"+calc.xarooday.toLocaleString(),"💰","#1565c0",true)}
    ${statCard(L("lbl_saafi"),"$"+calc.saafi.toLocaleString(),"💵","#0d6e4f",true)}
    ${statCard(L("lbl_aan_bixin"),calc.totalAanBixin,"⚠️","#e65100",true)}
  </div>`;

  if(activeTab==="xisaab") html+=renderXisaabTab(fd, calc, isLocked, color);
  if(activeTab==="kharash") html+=renderKharashTab(fd, calc, isLocked);
  if(activeTab==="charts") html+=renderChartsTab();
  if(activeTab==="settings" && isMaamul) html+=renderSettingsTab();

  return html;
}

// ── XISAAB TAB ────────────────────────────
function renderXisaabTab(fd, calc, isLocked, color){
  const fields = Object.keys(FIELD_LABELS);
  let html=`<div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:18px">
    <div class="panel-header" style="background:${color}">
      <span>📋 Xisaab Xirka — ${currentBisha}</span>
      ${isLocked?"<span style='font-size:12px;opacity:.8'>🔒 Qori la'aan</span>":""}
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Fasalka</th>
      ${fields.map(k=>{
        if(k==='ardaydaCusub') return `<th style="background:#e3f2fd!important;color:#1565c0!important;font-weight:700!important">Ardayda Cusub</th>`;
        if(k==='ardaydaBaxday') return `<th style="background:#fce4ec!important;color:#880e4f!important;font-weight:700!important">Ardayda Baxday</th>`;
        return `<th>${FIELD_LABELS[k]}</th>`;
      }).join("")}
      <th class="th-green">Wadarta Ardayda</th>
      <th class="th-blue">Wadarta Lacag</th>
    </tr></thead><tbody>`;

  fd.fasalada.forEach((f,i)=>{
    const wL = +f.tiradaBixisay * +f.qiimaha + +f.lacagtaSooHormartay + +f.previewPayment;
    const wA = +f.tiradaBixisay + +f.tiradaAanBixin + +f.scholarship + +f.freeStudents + +(f.ardaydaCusub||0);
    html+=`<tr><td style="font-weight:600;color:${color};white-space:nowrap;font-size:12px">${f.magaca}</td>`;
    fields.forEach(field=>{
      html+=`<td><input class="inp-cell" type="number" value="${f[field]}" ${isLocked?"disabled":""} onchange="updateFasal('${activeFarac}',${i},'${field}',this.value)"/></td>`;
    });
    html+=`<td class="td-green-bg">${wA}</td><td class="td-blue-bg">$${wL.toLocaleString()}</td></tr>`;
  });

  html+=`</tbody><tfoot><tr>
    <td style="color:#1a3a5c;font-size:12px">WADAR</td>
    <td class="td-green">${calc.totalBixisay}</td>
    <td>—</td>
    <td class="td-green">$${calc.totalHormartay.toLocaleString()}</td>
    <td class="td-green">$${calc.totalPreview.toLocaleString()}</td>
    <td class="td-red">${calc.totalAanBixin}</td>
    <td class="td-red">$${calc.totalLacagAanBixin.toLocaleString()}</td>
    <td>${calc.totalScholarship}</td>
    <td>${calc.totalFree}</td>
    <td style="color:#1565c0;font-weight:700">${calc.totalCusub}</td>
    <td style="color:#888;font-weight:700">${calc.totalBaxday}</td>
    <td class="tfoot-total-arday">${calc.totalArdayda}</td>
    <td class="tfoot-total-lacag">$${calc.xarooday.toLocaleString()}</td>
  </tr></tfoot></table></div></div>

  <div class="summary-grid">
    <div class="panel">
      <h4>🧮 Xisaabta Saafiga</h4>
      <div class="info-row"><span>Wadarta Xarooday</span><span>$${calc.xarooday.toLocaleString()}</span></div>
      <div class="discount-row">
        <span style="color:#555;font-size:13px">Qiima Dhimis (Discount)</span>
        <input class="discount-inp" type="number" value="${fd.discount}" ${isLocked?"disabled":""} onchange="updateMeta('${activeFarac}','discount',this.value)"/>
      </div>
      <div class="discount-row">
        <span style="color:#555;font-size:13px">Lacagta Ku Dhiman</span>
        <input class="discount-inp" type="number" value="${fd.lacagKhususi}" ${isLocked?"disabled":""} onchange="updateMeta('${activeFarac}','lacagKhususi',this.value)"/>
      </div>
      <div style="display:flex;justify-content:space-between;padding:12px 0 0;font-weight:700;font-size:15px">
        <span style="color:#1a3a5c">Wadarta Saafi</span>
        <span style="color:#0d6e4f">$${calc.saafi.toLocaleString()}</span>
      </div>
    </div>
    <div class="panel">
      <h4>📊 Kooban</h4>
      <div class="info-row"><span>Wadarta Ardayda</span><span style="color:#0d6e4f">${calc.totalArdayda}</span></div>
      <div class="info-row"><span>Scholarship</span><span>${calc.totalScholarship}</span></div>
      <div class="info-row"><span>Free Students</span><span>${calc.totalFree}</span></div>
      <div class="info-row"><span>Lacag Aan Bixin</span><span style="color:#c62828">$${calc.totalLacagAanBixin.toLocaleString()}</span></div>
      <div class="info-row"><span>${L("lbl_kharash")}</span><span style="color:#e65100">$${calc.kharashWadar.toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;padding:10px 0 0;font-weight:700;font-size:14px;border-top:2px solid #e0e0e0;margin-top:8px">
        <span style="color:#1a3a5c">Faa'iido / Khasaare</span>

      </div>
    </div>
  </div>`;
  return html;
}

// ── KHARASH TAB ────────────────────────────
function renderKharashTab(fd, calc, isLocked){
  let html=`<div class="panel">
    <h4>📋 ${L("lbl_kharash")} — ${currentBisha}</h4>`;
  Object.keys(KHARASH_LABELS).forEach(k=>{
    html+=`<div class="kharash-row">
      <span class="kharash-lbl">${KHARASH_LABELS[k]}</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:#888;font-size:13px">$</span>
        <input class="kharash-inp" type="number" value="${fd.kharash[k]}" ${isLocked?"disabled":""} onchange="updateKharash('${activeFarac}','${k}',this.value)"/>
      </div>
    </div>`;
  });
  html+=`<div style="display:flex;justify-content:space-between;padding:14px 0 0;font-weight:700;font-size:15px">
    <span style="color:#1a3a5c">Wadarta Kharashka</span>
    <span style="color:#c62828">$${calc.kharashWadar.toLocaleString()}</span>
  </div></div>`;
  return html;
}

    chartInstances["arday"] = new Chart(c1,{type:"bar",data:{labels,datasets:[

    {label:"⚠️ Aan Bixin",v:calc.totalAanBixin,c:"#dc2626"},

  const c4 = document.getElementById("chart-lacagkharash");
  const profit = calc.saafi - calc.kharashWadar;
  if(c4){
    const o = JSON.parse(JSON.stringify(base));
    o.scales.y.ticks.callback = v=>`$${v.toLocaleString()}`;
    o.plugins.legend.display = false;
    chartInstances["lk"] = new Chart(c4,{type:"bar",data:{
      labels:["💰 Lacag Saafi","📤 Kharash","📈 Faa'iido / Khasaare"],
      datasets:[{

function renderSettingsTab(){
  const tabs = [
    {id:"fasalada", icon:"🏫", label:"Fasalada"},
    {id:"users",    icon:"👥", label:"Isticmaalayaasha"},
    {id:"luuqad",   icon:"🌐", label:"Luuqadda"},
  ];

  let html = `<div class="panel" style="padding:14px 18px">
    <div class="settings-tab-bar">
      ${tabs.map(t=>`<button class="settings-tab-btn ${activeSettingsTab===t.id?"active":""}" onclick="setSettingsTab('${t.id}')">${t.icon} ${t.label}</button>`).join("")}
    </div>`;

  if(activeSettingsTab==="fasalada") html += renderSettingsFasalada();
  else if(activeSettingsTab==="users") html += renderSettingsUsers();
  else if(activeSettingsTab==="luuqad") html += renderSettingsLuuqad();

  html += `</div>`;
  return html;
}

// STAT CARD HELPER
// ══════════════════════════════════════════
function statCard(label, value, icon, color, small){
  const bgAlpha = color.startsWith('#') ? hexToRgba(color, 0.12) : color;
  return `<div class="stat-card ${small?"":"stat-card-lg"}" style="--accent:${color}">
    <div class="stat-card-inner">
      <div style="flex:1">
        <div class="stat-card-lbl">${label}</div>
        <div class="stat-card-val ${small?"small":""}" style="color:${color}">${value}</div>
      </div>
      <div class="stat-card-icon-wrap ${small?"small":""}" style="background:${bgAlpha}">${icon}</div>
    </div>
  </div>`;
}
function hexToRgba(hex, a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ══════════════════════════════════════════
// DATA MUTATIONS
// ══════════════════════════════════════════
function canEdit(key){ return !appData[key]?.submitted || currentUser.role==="maamul"; }

function updateFasal(key, idx, field, val){
  if(!canEdit(key)) return;
  appData[key].fasalada[idx][field] = val;
  scheduleSave();
  refreshCalcDisplay();
}
function updateKharash(key, field, val){
  if(!canEdit(key)) return;
  appData[key].kharash[field] = val;
  scheduleSave();
  refreshCalcDisplay();
}
function updateMeta(key, field, val){
  if(!canEdit(key)) return;
  appData[key][field] = val;
  scheduleSave();
  refreshCalcDisplay();
}

function refreshCalcDisplay(){
  const scrollTop = document.getElementById("main-content").scrollTop;
  renderContent();
  document.getElementById("main-content").scrollTop = scrollTop;
}

function saveDraft(key){
  appData[key].savedAt = new Date().toISOString();
  scheduleSave();
  showToast(L("msg_saved"));
  renderAll();
}
function submitFarac(key){
  appData[key].submitted = true;
  appData[key].savedAt = new Date().toISOString();
  closeModal();
  scheduleSave();
  showToast(L("msg_submitted"),"info");
  renderAll();
}
function unlockFarac(key){
  appData[key].submitted = false;
  scheduleSave();
  showToast(L("msg_unlocked"),"info");
  renderAll();
}
function addFasal(){
  const nameEl = document.getElementById("new-fasal-name");
  const faracEl = document.getElementById("new-fasal-farac");
  const qiimeEl = document.getElementById("new-fasal-qiime");
  if(!nameEl || !nameEl.value.trim()) return;
  const farac = faracEl ? faracEl.value : activeFarac;
  const name = nameEl.value.trim();
  const newFasal = emptyFasal(name, farac);
  if(qiimeEl && qiimeEl.value !== "") newFasal.qiimaha = +qiimeEl.value;
  appData[farac].fasalada.push(newFasal);
  scheduleSave();
  showToast(`✅ "${name}" ($${newFasal.qiimaha}) waa lagu daray ${FARAC_LABELS[farac]}`);
  renderAll();
}
function removeFasal(key, idx){
  appData[key].fasalada.splice(idx,1);
  scheduleSave();
  showToast("🗑️ Fasalku waa la tirtirray","warning");
  renderAll();
}
function updateFasalQiime(key, idx, val){
  if(!canEdit(key)) return;
  appData[key].fasalada[idx].qiimaha = +val;
  scheduleSave();
  refreshCalcDisplay();
}
function resetFarac(key){
  appData[key] = {
    fasalada: DEFAULT_FASALADA[key].map(n=>emptyFasal(n,key)),
    kharash:{maamulka:0,macalimiinta:0,shaqaalaha:0,canshuurta:0,dareewalada:0,kharashDugsiga:0},
    discount:0, lacagKhususi:0, submitted:false, savedAt:null
  };
  closeModal();
  scheduleSave();
  showToast("♻️ Faracka waa la nadiifiyey","warning");
  renderAll();
}

// ── USER MANAGEMENT ───────────────────────
function addUser(){
  const username = (document.getElementById("new-user-name")?.value||"").trim().toLowerCase();
  const password = (document.getElementById("new-user-pass")?.value||"").trim();
  const label    = (document.getElementById("new-user-label")?.value||"").trim();
  const role     = document.getElementById("new-user-role")?.value || "sare";
  if(!username || !password){ showToast("⚠️ Username iyo Password buuxi","warning"); return; }
  if(USERS[username]){ showToast("⚠️ Username horey u jira","warning"); return; }
  USERS[username] = {password, role, label: label||username};
  saveUsersToFb();
  showToast(`✅ User "${username}" waa la abuuray`);
  renderContent();
}
function deleteUser(username){
  if(username === currentUser.username){ showToast("⚠️ Nafta user-kaaga ma tirtiri kartid","warning"); return; }
  delete USERS[username];
  saveUsersToFb();
  showToast(`🗑️ User "${username}" waa la tirtirray`,"warning");
  renderContent();
}
function resetUsersToDefault(){
  USERS = {...DEFAULT_USERS};
  saveUsersToFb();
  showToast("♻️ Users-ka waa dib loo dejiyey","warning");
  renderContent();
}

// ── QIIMAHA / LANG SETTINGS ───────────────
function updateDefaultQiime(key, val){
  defaultQiimaha[key] = +val;
}
function saveQiimaha(){
  saveSettingsToFb();
  showToast("💾 Qiimaha waa la kaydiyey");
}
function changeLang(code){
  currentLang = code;
  saveSettingsToFb();
  renderAll();
}

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function openSubmitModal(key){
  modalAction = {type:"submit", key};
  document.getElementById("modal-title").textContent = L("modal_submit_title");
  document.getElementById("modal-body").textContent = `${L("modal_submit_body")} ${FARAC_LABELS[key]}? ${L("modal_submit_body2")}`;
  const btn = document.getElementById("modal-confirm-btn");
  btn.textContent = L("btn_gudbi"); btn.style.background="#1565c0";
  document.querySelector(".btn-cancel").textContent = L("btn_jooji");
  document.getElementById("modal-overlay").classList.add("show");
}
function openResetModal(key){
  modalAction = {type:"reset", key};
  document.getElementById("modal-title").textContent = L("modal_reset_title");
  document.getElementById("modal-body").textContent = `${L("modal_reset_body")} ${FARAC_LABELS[key]}?`;
  const btn = document.getElementById("modal-confirm-btn");
  btn.textContent = L("btn_nadiifi"); btn.style.background="#c62828";
  document.querySelector(".btn-cancel").textContent = L("btn_jooji");
  document.getElementById("modal-overlay").classList.add("show");
}
function closeModal(){ document.getElementById("modal-overlay").classList.remove("show"); modalAction=null; }
document.getElementById("modal-confirm-btn").addEventListener("click",()=>{
  if(!modalAction) return;
  if(modalAction.type==="submit") submitFarac(modalAction.key);
  else if(modalAction.type==="reset") resetFarac(modalAction.key);
});

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
let toastTimeout;
function showToast(msg, type="success"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = type==="info"?"#1565c0":type==="warning"?"#e65100":"#0d6e4f";
  t.style.display = "block";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.style.display="none"; }, 3000);
}

function destroyCharts(){
  Object.values(chartInstances).forEach(c=>{ try{ c.destroy(); }catch{} });
  chartInstances = {};
}

// INIT
// ══════════════════════════════════════════
async function appInit(){
  const sel=document.getElementById("bisha-select");
  if(sel.options.length===0){
    BILAHA.forEach(b=>{ const o=document.createElement("option"); o.value=b; o.textContent=b; sel.appendChild(o); });
  }
  setFbLoading(true);
  try{
    await loadUsersAndSettings();
    applyLangToLogin();
    const savedBisha = await fbGetOnce(BISHA_FB_PATH);
    currentBisha = (savedBisha && BILAHA.includes(savedBisha)) ? savedBisha : BILAHA[new Date().getMonth()];
    sel.value = currentBisha;
    const snap = await fbGetOnce(getFbPath(currentBisha));
    if(snap && typeof snap==="object"){
      appData = snap;
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!appData[k]) appData[k]=buildInitFarac()[k]; });
    }
  }catch{ appData=buildInitFarac(); }
  finally{ setFbLoading(false); }
  startListener(currentBisha);
}

if(window._fbReady){
  appInit();
} else {
  window.addEventListener("fb-ready", appInit, {once:true});
}
</script>
</body>
</html>
