<script>
// ══════════════════════════════════════════
// FIREBASE SDK HELPERS (set via module above)
// ══════════════════════════════════════════
function getFbPath(bisha){ return `xisaab/${bisha.replace(/\s/g,"_")}`; }
const BISHA_FB_PATH = "meta/bisha";

let _activeListener = null; // track current onValue unsubscribe fn

async function fbSet(path, value){
  await window._fbSet(window._fbRef(window._fbDb, path), value);
}
async function fbGetOnce(path){
  const snap = await window._fbGet(window._fbRef(window._fbDb, path));
  return snap.exists() ? snap.val() : null;
}
// Start real-time listener for current bisha — auto-updates screen when anyone changes data
function startListener(bisha){
  if(_activeListener){ _activeListener(); _activeListener=null; } // unsubscribe old
  const dbRef = window._fbRef(window._fbDb, getFbPath(bisha));
  _activeListener = window._fbOnValue(dbRef, (snapshot)=>{
    const incoming = snapshot.val();
    if(incoming && typeof incoming==="object"){
      // Merge: keep keys not in incoming (other months untouched)
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!incoming[k]) incoming[k]=buildInitFarac()[k]; });
      appData = incoming;
    } else {
      appData = buildInitFarac();
    }
    // Only re-render if user is logged in
    if(currentUser) renderAll();
  });
}

// ══════════════════════════════════════════
// DATA CONSTANTS
// ══════════════════════════════════════════
const USERS = {
  maamul:{password:"maamul@2024",role:"maamul",label:"Maamulka"},
  sare:  {password:"sare@2024",  role:"sare",  label:"Dugsiga Sare"},
  dhexe: {password:"dhexe@2024", role:"dhexe", label:"Dugsiga Dhexe"},
  hoose1:{password:"hoose1@2024",role:"hoose1",label:"Hoose 1"},
  hoose2:{password:"hoose2@2024",role:"hoose2",label:"Hoose 2"},
};
const FARAC_COLORS = {sare:"#0d6e4f",dhexe:"#7b3f00",hoose1:"#4a1a6b",hoose2:"#8b1a2a"};
const FARAC_LABELS = {sare:"Dugsiga Sare",dhexe:"Dugsiga Dhexe",hoose1:"Hoose 1",hoose2:"Hoose 2"};
const BILAHA = ["Janaayo","Febraayo","Maarso","Abriil","May","Juun","Luuliyo","Ogosto","Sebtembar","Oktoobar","Noofembar","Disembar"];
const DEFAULT_FASALADA = {
  sare:  ["Level One","Level Two"],
  dhexe: ["1aad","2aad","3aad"],
  hoose1:["Fasalka 1","Fasalka 2","Fasalka 3"],
  hoose2:["Fasalka 4","Fasalka 5","Basaska"],
};
const FIELD_LABELS = {
  tiradaBixisay:"Tirada Bixisay", qiimaha:"Qiimaha ($)",
  lacagtaSooHormartay:"Soo Hormartay ($)", previewPayment:"Preview Pay ($)",
  tiradaAanBixin:"Aan Bixin", lacagtaAanBixin:"Lacag Aan Bixin ($)",
  scholarship:"Scholarship", freeStudents:"Free Students"
};
const KHARASH_LABELS = {
  maamulka:"Maamulka", macalimiinta:"Macalimiinta", shaqaalaha:"Shaqaalaha",
  canshuurta:"Canshuurta", dareewalada:"Dareewalada", kharashDugsiga:"Kharash Dugsiga"
};
const PIE_COLORS = ["#0d6e4f","#1565c0","#7b3f00","#8b1a2a"];

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let currentUser = null;
let currentBisha = BILAHA[new Date().getMonth()];
let appData = buildInitFarac();
let activeFarac = null;
let activeTab = "xisaab";
let modalAction = null;
let chartInstances = {};

function emptyFasal(name){
  return {magaca:name,tiradaBixisay:0,qiimaha:13,lacagtaSooHormartay:0,previewPayment:0,tiradaAanBixin:0,lacagtaAanBixin:0,scholarship:0,freeStudents:0};
}
function buildInitFarac(){
  const d={};
  Object.keys(DEFAULT_FASALADA).forEach(k=>{
    d[k]={fasalada:DEFAULT_FASALADA[k].map(emptyFasal),kharash:{maamulka:0,macalimiinta:0,shaqaalaha:0,canshuurta:0,dareewalada:0,kharashDugsiga:0},discount:0,lacagKhususi:0,submitted:false,savedAt:null};
  });
  return d;
}
function calcFarac(fd){
  let tB=0,tL=0,tH=0,tP=0,tAB=0,tLAB=0,tS=0,tF=0;
  fd.fasalada.forEach(f=>{
    tB +=+f.tiradaBixisay; tL +=+f.tiradaBixisay * +f.qiimaha;
    tH +=+f.lacagtaSooHormartay; tP +=+f.previewPayment;
    tAB+=+f.tiradaAanBixin; tLAB+=+f.lacagtaAanBixin;
    tS +=+f.scholarship; tF +=+f.freeStudents;
  });
  const kWadar=Object.values(fd.kharash).reduce((a,b)=>a+(+b),0);
  const xarooday=tL+tH+tP;
  const saafi=xarooday-(+fd.discount)-(+fd.lacagKhususi);
  const totalArdayda=tB+tAB+tS+tF;
  return {totalBixisay:tB,totalLacag:tL,totalHormartay:tH,totalPreview:tP,totalAanBixin:tAB,totalLacagAanBixin:tLAB,totalScholarship:tS,totalFree:tF,kharashWadar:kWadar,xarooday,saafi,totalArdayda};
}

// ══════════════════════════════════════════
// FIREBASE LOAD/SAVE
// ══════════════════════════════════════════
function setFbLoading(on){ document.getElementById("fb-loading").style.display=on?"block":"none"; }

async function loadBisha(targetBisha){
  setFbLoading(true);
  try{
    const snap = await fbGetOnce(getFbPath(targetBisha));
    if(snap && typeof snap==="object"){
      appData = snap;
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!appData[k]) appData[k]=buildInitFarac()[k]; });
    } else { appData=buildInitFarac(); }
  }catch(e){ appData=buildInitFarac(); }
  finally{ setFbLoading(false); }
  startListener(targetBisha); // start real-time listener
}

let saveTimeout = null;
function scheduleSave(){
  if(saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async()=>{
    try{ await fbSet(getFbPath(currentBisha), appData); }catch{}
  }, 800);
}

async function handleBishaChange(bisha){
  // Save current before switching
  try{ await fbSet(getFbPath(currentBisha), appData); }catch{}
  currentBisha = bisha;
  try{ await fbSet(BISHA_FB_PATH, bisha); }catch{}
  await loadBisha(bisha);
  renderAll();
}

// ══════════════════════════════════════════
// LOGIN / LOGOUT
// ══════════════════════════════════════════
function doLogin(){
  const u = document.getElementById("inp-user").value.trim().toLowerCase();
  const p = document.getElementById("inp-pass").value;
  const usr = USERS[u];
  if(usr && usr.password===p){
    currentUser = {...usr, username:u};
    document.getElementById("login-err").style.display="none";
    activeFarac = usr.role!=="maamul" ? usr.role : "sare";
    activeTab = "xisaab";
    document.getElementById("login-page").style.display="none";
    document.getElementById("app-page").classList.add("show");
    document.getElementById("header-user-label").textContent = "👤 "+usr.label;
    renderAll();
  } else {
    document.getElementById("login-err").style.display="block";
  }
}
function doLogout(){
  currentUser=null; activeFarac=null; activeTab="xisaab";
  document.getElementById("app-page").classList.remove("show");
  document.getElementById("login-page").style.display="flex";
  document.getElementById("inp-user").value="";
  document.getElementById("inp-pass").value="";
}
function togglePwdList(){
  const el=document.getElementById("pwd-list");
  const btn=document.querySelector(".show-pwd-btn");
  if(el.style.display==="block"){ el.style.display="none"; btn.textContent="Muuji Login-yada"; return; }
  el.style.display="block"; btn.textContent="Qari Login-yada";
  el.innerHTML = Object.entries(USERS).map(([k,v])=>
    `<div class="pwd-row"><span>${k}</span><span>${v.password}</span></div>`
  ).join("");
}

// ══════════════════════════════════════════
// RENDER ALL
// ══════════════════════════════════════════
function renderAll(){
  populateBishaSelect();
  renderSidebar();
  renderContent();
}

function populateBishaSelect(){
  const sel=document.getElementById("bisha-select");
  if(sel.options.length===0){
    BILAHA.forEach(b=>{ const o=document.createElement("option"); o.value=b; o.textContent=b; sel.appendChild(o); });
  }
  sel.value = currentBisha;
}

// ══════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════
function renderSidebar(){
  const isMaamul = currentUser.role==="maamul";
  const sb = document.getElementById("sidebar");
  let html="";
  if(isMaamul){
    html += `<div class="sb-section-lbl">Faracyada</div>`;
    Object.keys(FARAC_COLORS).forEach(k=>{
      const activeClass = activeFarac===k ? `active-${k}` : "";
      html += `<button class="sb-farac-btn ${activeClass}" onclick="selectFarac('${k}')">
        <span style="display:flex;align-items:center;gap:7px"><span class="sb-dot" style="background:${FARAC_COLORS[k]}"></span>${FARAC_LABELS[k]}</span>
        ${appData[k]?.submitted?"<span style='font-size:10px'>✅</span>":""}
      </button>`;
    });
    html += `<div class="sb-divider sidebar-divider-block">
      <button class="sb-guud-btn ${activeFarac===null?"active":""}" onclick="selectGuud()">📊 Guud Ahaan</button>
    </div>`;
    // mobile guud button
    html += `<button class="sb-farac-btn ${activeFarac===null?"active-guud":""}" style="white-space:nowrap;flex-shrink:0" onclick="selectGuud()">📊 Guud</button>`;
  } else {
    html += `<div class="non-maamul-badge" style="background:${FARAC_COLORS[currentUser.role]}">
      <div class="label">${FARAC_LABELS[currentUser.role]}</div>
      ${appData[currentUser.role]?.submitted?`<div class="sub">✅ Gudbi la sameeyey</div>`:""}
    </div>`;
  }
  if(activeFarac){
    html += `<div style="border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:6px">
      <div class="sb-section-lbl">TABS</div>`;
    const tabs=[{id:"xisaab",icon:"💰",label:"Xisaab Xirka"},{id:"kharash",icon:"📋",label:"Kharashka"},{id:"charts",icon:"📊",label:"Charts"}];
    if(isMaamul) tabs.push({id:"settings",icon:"⚙️",label:"Settings"});
    tabs.forEach(t=>{ html+=`<button class="sb-tab-btn ${activeTab===t.id?"active":""}" onclick="selectTab('${t.id}')">${t.icon} ${t.label}</button>`; });
    html+="</div>";
  }
  sb.innerHTML=html;
}

function selectFarac(k){ activeFarac=k; activeTab="xisaab"; renderAll(); }
function selectGuud(){ activeFarac=null; activeTab="guud"; renderAll(); }
function selectTab(t){ activeTab=t; renderContent(); renderSidebar(); }

// ══════════════════════════════════════════
// CONTENT
// ══════════════════════════════════════════
function renderContent(){
  destroyCharts();
  const isMaamul = currentUser.role==="maamul";
  const mc = document.getElementById("main-content");
  if(activeFarac===null && isMaamul){ mc.innerHTML=renderGuud(); initGuudCharts(); return; }
  if(activeFarac){ mc.innerHTML=renderFaracDetail(); if(activeTab==="charts") initFaracCharts(); return; }
  mc.innerHTML="";
}

// ── GUUD ──────────────────────────────────
function renderGuud(){
  const allStats = Object.keys(FARAC_COLORS).map(k=>({key:k,label:FARAC_LABELS[k],color:FARAC_COLORS[k],submitted:appData[k]?.submitted,...calcFarac(appData[k])}));
  const grand = allStats.reduce((a,s)=>({saafi:a.saafi+s.saafi,kharashWadar:a.kharashWadar+s.kharashWadar,totalArdayda:a.totalArdayda+s.totalArdayda}),{saafi:0,kharashWadar:0,totalArdayda:0});

  let html=`<h2 style="color:#1a3a5c;margin:0 0 16px;font-size:16px">📊 Warbixinta Guud — ${currentBisha}</h2>
  <div class="stat-grid-3">
    ${statCard("Wadarta Ardayda",grand.totalArdayda,"👨‍🎓","#1a3a5c",false)}
    ${statCard("Lacag Saafi (Guud)","$"+grand.saafi.toLocaleString(),"💵","#0d6e4f",false)}
    ${statCard("Kharash (Guud)","$"+grand.kharashWadar.toLocaleString(),"📤","#8b1a2a",false)}
  </div>
  <div class="panel"><h4>📈 Barbardhig Faracyada</h4><div class="chart-canvas-wrap"><canvas id="chart-guud-bar"></canvas></div></div>
  <div class="summary-grid">`;
  allStats.forEach(s=>{
    const profit = s.saafi - s.kharashWadar;
    html+=`<div class="farac-overview-card" style="border-top-color:${s.color}">
      <div class="farac-ov-top">
        <h3 style="color:${s.color};margin:0;font-size:15px">${s.label}</h3>
        <span style="display:flex;gap:5px">
          <span style="background:${s.color};color:#fff;border-radius:5px;padding:2px 8px;font-size:11px">${s.totalArdayda} Arday</span>
          ${s.submitted?"<span style='background:#0d6e4f;color:#fff;border-radius:5px;padding:2px 7px;font-size:10px'>✅</span>":""}
        </span>
      </div>
      <div class="farac-ov-mini">
        <div class="mini-stat"><div class="mini-stat-lbl">Lacag Xarooday</div><div class="mini-stat-val">$${s.xarooday.toLocaleString()}</div></div>
        <div class="mini-stat"><div class="mini-stat-lbl">Saafi</div><div class="mini-stat-val">$${s.saafi.toLocaleString()}</div></div>
        <div class="mini-stat"><div class="mini-stat-lbl">Aan Bixin</div><div class="mini-stat-val">${s.totalAanBixin}</div></div>
        <div class="mini-stat"><div class="mini-stat-lbl">Kharash</div><div class="mini-stat-val">$${s.kharashWadar.toLocaleString()}</div></div>
      </div>
      <div class="farac-ov-footer ${profit>=0?"profit":"loss"}">
        <span style="font-size:12px;color:#555">Faa'iido / Khasaare</span>
        <span style="font-weight:700;color:${profit>=0?"#0d6e4f":"#c62828"};font-size:13px">$${profit.toLocaleString()}</span>
      </div>
      ${s.submitted?`<button class="btn-unlock-sm" onclick="unlockFarac('${s.key}')">🔓 Fur / Unlock</button>`:""}
    </div>`;
  });
  html+="</div>";
  return html;
}

function initGuudCharts(){
  const allStats = Object.keys(FARAC_COLORS).map(k=>({label:FARAC_LABELS[k],...calcFarac(appData[k])}));
  const ctx = document.getElementById("chart-guud-bar");
  if(!ctx) return;
  chartInstances["guud-bar"] = new Chart(ctx,{
    type:"bar",
    data:{
      labels:allStats.map(s=>s.label),
      datasets:[
        {label:"Ardayda",data:allStats.map(s=>s.totalArdayda),backgroundColor:"#1a3a5c",borderRadius:3},
        {label:"Lacag",data:allStats.map(s=>s.saafi),backgroundColor:"#0d6e4f",borderRadius:3},
        {label:"Kharash",data:allStats.map(s=>s.kharashWadar),backgroundColor:"#c62828",borderRadius:3},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11}}}},scales:{x:{ticks:{font:{size:11}}},y:{ticks:{font:{size:11}}}}}
  });
}

// ── FARAC DETAIL ──────────────────────────
function renderFaracDetail(){
  const isMaamul = currentUser.role==="maamul";
  const fd = appData[activeFarac];
  const calc = calcFarac(fd);
  const isLocked = fd.submitted && !isMaamul;
  const color = FARAC_COLORS[activeFarac];

  let html=`
  <div class="farac-detail-header">
    <div class="farac-title">
      <div class="farac-bar" style="background:${color}"></div>
      <div>
        <h2 style="margin:0;color:#1a3a5c;font-size:17px">${FARAC_LABELS[activeFarac]}</h2>
        <span style="color:#888;font-size:11px">📅 ${currentBisha} ${new Date().getFullYear()}</span>
      </div>
    </div>
    <div class="action-btns">
      ${fd.submitted?"<span class='badge-submitted'>✅ La Gudbiyey</span>":""}
      ${!fd.submitted?`
        <button class="btn-save" onclick="saveDraft('${activeFarac}')">💾 Save</button>
        ${!isMaamul?`<button class="btn-gudbi" onclick="openSubmitModal('${activeFarac}')">📤 Gudbi</button>`:""}
      `:""}
      ${fd.submitted && isMaamul?`<button class="btn-unlock" onclick="unlockFarac('${activeFarac}')">🔓 Unlock</button>`:""}
    </div>
  </div>
  ${isLocked?`<div class="alert-locked">🔒 Xogtan waa la gudbiyey maamulka. Waxaad arki kartaa laakiin ma bedeli kartid.</div>`:""}
  ${fd.savedAt && !fd.submitted?`<div class="alert-saved">💾 Kaydsan: ${new Date(fd.savedAt).toLocaleString()}</div>`:""}

  <div class="stat-grid-5">
    ${statCard("Wadarta Ardayda",calc.totalArdayda,"👥",color,true)}
    ${statCard("Bixisay",calc.totalBixisay,"✅","#0d6e4f",true)}
    ${statCard("Lacag Xarooday","$"+calc.xarooday.toLocaleString(),"💰","#1565c0",true)}
    ${statCard("Lacagta Saafi","$"+calc.saafi.toLocaleString(),"💵","#0d6e4f",true)}
    ${statCard("Aan Bixin",calc.totalAanBixin,"⚠️","#e65100",true)}
  </div>`;

  if(activeTab==="xisaab") html+=renderXisaabTab(fd, calc, isLocked, color);
  if(activeTab==="kharash") html+=renderKharashTab(fd, calc, isLocked);
  if(activeTab==="charts") html+=renderChartsTab();
  if(activeTab==="settings" && isMaamul) html+=renderSettingsTab();

  return html;
}

      <th>Fasalka</th>

  fd.fasalada.forEach((f,i)=>{
    const wL = +f.tiradaBixisay * +f.qiimaha + +f.lacagtaSooHormartay + +f.previewPayment;
    const wA = +f.tiradaBixisay + +f.tiradaAanBixin + +f.scholarship + +f.freeStudents;

  html+=`</tbody><tfoot><tr>
    <td style="color:#1a3a5c;font-size:12px">WADAR</td>
    <td class="td-green">${calc.totalBixisay}</td>
    <td>—</td>

    <td class="td-green">$${calc.totalPreview.toLocaleString()}</td>
    <td class="td-red">${calc.totalAanBixin}</td>
    <td class="td-red">$${calc.totalLacagAanBixin.toLocaleString()}</td>
    <td>${calc.totalScholarship}</td>

    <td class="tfoot-total-arday">${calc.totalArdayda}</td>

        <input class="discount-inp" type="number" value="${fd.lacagKhususi}" ${isLocked?"disabled":""} onchange="updateMeta('${activeFarac}','lacagKhususi',this.value)"/>
      </div>
      <div style="display:flex;justify-content:space-between;padding:12px 0 0;font-weight:700;font-size:15px">

    </div>
    <div class="panel">
      <h4>📊 Kooban</h4>

  const fd = appData[activeFarac];
  const calc = calcFarac(fd);
  const labels = fd.fasalada.map(f=>f.magaca);

  // Ardayda bar
  const c1 = document.getElementById("chart-arday");
  if(c1) chartInstances["arday"] = new Chart(c1,{type:"bar",data:{labels,datasets:[
    {label:"Bixisay",data:fd.fasalada.map(f=>+f.tiradaBixisay),backgroundColor:"#0d6e4f",borderRadius:3},
    {label:"Aan Bixin",data:fd.fasalada.map(f=>+f.tiradaAanBixin),backgroundColor:"#c62828",borderRadius:3},
    {label:"Scholarship",data:fd.fasalada.map(f=>+f.scholarship),backgroundColor:"#1565c0",borderRadius:3},
    {label:"Free",data:fd.fasalada.map(f=>+f.freeStudents),backgroundColor:"#e65100",borderRadius:3},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9}}}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9}}}}}});

  // Lacag bar
  const c2 = document.getElementById("chart-lacag");
  if(c2) chartInstances["lacag"] = new Chart(c2,{type:"bar",data:{labels,datasets:[
    {label:"Lacag",data:fd.fasalada.map(f=>+f.tiradaBixisay * +f.qiimaha + +f.lacagtaSooHormartay + +f.previewPayment),backgroundColor:"#1a3a5c",borderRadius:4},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9},callback:v=>`$${v}`}}}}});

  // Pie
  const c3 = document.getElementById("chart-pie");
  const pieData = [{label:"Bixisay",v:calc.totalBixisay},{label:"Aan Bixin",v:calc.totalAanBixin},{label:"Scholarship",v:calc.totalScholarship},{label:"Free",v:calc.totalFree}].filter(d=>d.v>0);
  if(c3 && pieData.length) chartInstances["pie"] = new Chart(c3,{type:"pie",data:{labels:pieData.map(d=>d.label),datasets:[{data:pieData.map(d=>d.v),backgroundColor:PIE_COLORS}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10}}}}}});

  // Lacag vs Kharash
  const c4 = document.getElementById("chart-lacagkharash");
  const profit = calc.saafi - calc.kharashWadar;
  if(c4) chartInstances["lk"] = new Chart(c4,{type:"bar",data:{
    labels:["Lacag Saafi","Kharash","Faa'iido"],
    datasets:[{data:[calc.saafi,calc.kharashWadar,profit],backgroundColor:["#1565c0","#c62828",profit>=0?"#0d6e4f":"#c62828"],borderRadius:4}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9},callback:v=>`$${v}`}}}}});
}

// ── SETTINGS TAB ──────────────────────────
function renderSettingsTab(){
  const faracOpts = Object.keys(FARAC_COLORS).map(k=>`<option value="${k}">${FARAC_LABELS[k]}</option>`).join("");
  const fasalList = (appData[activeFarac]?.fasalada||[]).map((f,i)=>
    `<div class="fasal-item"><span style="font-size:13px;color:#333">${f.magaca}</span>
     <button class="btn-del-fasal" onclick="removeFasal('${activeFarac}',${i})">🗑️</button></div>`
  ).join("");

  return `<div class="settings-grid">
    <div class="panel">
      <h4>➕ Ku Dar Fasal Cusub</h4>
      <label class="form-lbl">Faracka</label>
      <select id="new-fasal-farac" class="form-select">${faracOpts}</select>
      <label class="form-lbl">Magaca Fasalka</label>
      <input id="new-fasal-name" class="form-input" placeholder="Tusaale: 6aad" onkeydown="if(event.key==='Enter')addFasal()"/>
      <button class="btn-add" onclick="addFasal()">➕ Ku Dar</button>
    </div>
    <div class="panel">
      <h4>📝 Fasalada ${FARAC_LABELS[activeFarac]}</h4>
      <div class="fasal-list">${fasalList||"<p style='color:#aaa;font-size:13px'>Fasal ma jiro</p>"}</div>
      <button class="btn-reset" onclick="openResetModal('${activeFarac}')">♻️ Dib u Deji (Reset) Faracka</button>
    </div>
  </div>`;
}

// ══════════════════════════════════════════
// STAT CARD HELPER
// ══════════════════════════════════════════
function statCard(label, value, icon, color, small){
  return `<div class="stat-card ${small?"":"stat-card-lg"}" style="border-left-color:${color}">
    <div class="stat-card-inner">
      <div>
        <div class="stat-card-lbl">${label}</div>
        <div class="stat-card-val ${small?"small":""}" style="color:${color}">${value}</div>
      </div>
      <span class="stat-card-icon ${small?"small":""}">${icon}</span>
    </div>
  </div>`;
}

// ══════════════════════════════════════════
// DATA MUTATIONS
// ══════════════════════════════════════════
function canEdit(key){ return !appData[key]?.submitted || currentUser.role==="maamul"; }

function updateFasal(key, idx, field, val){
  if(!canEdit(key)) return;
  appData[key].fasalada[idx][field] = val;
  scheduleSave();
  refreshCalcDisplay();
}
function updateKharash(key, field, val){
  if(!canEdit(key)) return;
  appData[key].kharash[field] = val;
  scheduleSave();
  refreshCalcDisplay();
}
function updateMeta(key, field, val){
  if(!canEdit(key)) return;
  appData[key][field] = val;
  scheduleSave();
  refreshCalcDisplay();
}

function refreshCalcDisplay(){
  // re-render stat cards and summary without full re-render
  // lightweight: just re-render content
  const scrollTop = document.getElementById("main-content").scrollTop;
  renderContent();
  document.getElementById("main-content").scrollTop = scrollTop;
}

function saveDraft(key){
  appData[key].savedAt = new Date().toISOString();
  scheduleSave();
  showToast("✅ Xogtu waa la kaydiyey");
  renderAll();
}
function submitFarac(key){
  appData[key].submitted = true;
  appData[key].savedAt = new Date().toISOString();
  closeModal();
  scheduleSave();
  showToast("📤 Xogtu waa la gudbiyey maamulka!","info");
  renderAll();
}
function unlockFarac(key){
  appData[key].submitted = false;
  scheduleSave();
  showToast("🔓 Faracka waa la furiye","info");
  renderAll();
}
function addFasal(){
  const nameEl = document.getElementById("new-fasal-name");
  const faracEl = document.getElementById("new-fasal-farac");
  if(!nameEl || !nameEl.value.trim()) return;
  const farac = faracEl ? faracEl.value : activeFarac;
  const name = nameEl.value.trim();
  appData[farac].fasalada.push(emptyFasal(name));
  scheduleSave();
  showToast(`✅ "${name}" waa lagu daray ${FARAC_LABELS[farac]}`);
  renderAll();
}
function removeFasal(key, idx){
  appData[key].fasalada.splice(idx,1);
  scheduleSave();
  showToast("🗑️ Fasalku waa la tirtirray","warning");
  renderAll();
}
function resetFarac(key){
  appData[key] = {
    fasalada: DEFAULT_FASALADA[key].map(emptyFasal),
    kharash:{maamulka:0,macalimiinta:0,shaqaalaha:0,canshuurta:0,dareewalada:0,kharashDugsiga:0},
    discount:0, lacagKhususi:0, submitted:false, savedAt:null
  };
  closeModal();
  scheduleSave();
  showToast("♻️ Faracka waa la nadiifiyey","warning");
  renderAll();
}

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function openSubmitModal(key){
  modalAction = {type:"submit", key};
  document.getElementById("modal-title").textContent = "📤 Xogta Gudbi";
  document.getElementById("modal-body").textContent = `Ma hubtaa inaad u gudbinayso maamulka xogta ${FARAC_LABELS[key]}? Kadib ma beddeli kartid.`;
  const btn = document.getElementById("modal-confirm-btn");
  btn.textContent = "Haa, Gudbi"; btn.style.background="#1565c0";
  document.getElementById("modal-overlay").classList.add("show");
}
function openResetModal(key){
  modalAction = {type:"reset", key};
  document.getElementById("modal-title").textContent = "♻️ Xog Nadiifi";
  document.getElementById("modal-body").textContent = `Ma hubtaa inaad nadiifin lahayd dhammaan xogta ${FARAC_LABELS[key]}?`;
  const btn = document.getElementById("modal-confirm-btn");
  btn.textContent = "Haa, Nadiifi"; btn.style.background="#c62828";
  document.getElementById("modal-overlay").classList.add("show");
}
function closeModal(){ document.getElementById("modal-overlay").classList.remove("show"); modalAction=null; }
document.getElementById("modal-confirm-btn").addEventListener("click",()=>{
  if(!modalAction) return;
  if(modalAction.type==="submit") submitFarac(modalAction.key);
  else if(modalAction.type==="reset") resetFarac(modalAction.key);
});

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
let toastTimeout;
function showToast(msg, type="success"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = type==="info"?"#1565c0":type==="warning"?"#e65100":"#0d6e4f";
  t.style.display = "block";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.style.display="none"; }, 3000);
}

// ══════════════════════════════════════════
// CHART CLEANUP
// ══════════════════════════════════════════
function destroyCharts(){
  Object.values(chartInstances).forEach(c=>{ try{ c.destroy(); }catch{} });
  chartInstances = {};
}

// ══════════════════════════════════════════
// INIT — waits for Firebase SDK module to load
// ══════════════════════════════════════════
async function appInit(){
  // Populate bisha dropdown
  const sel=document.getElementById("bisha-select");
  if(sel.options.length===0){
    BILAHA.forEach(b=>{ const o=document.createElement("option"); o.value=b; o.textContent=b; sel.appendChild(o); });
  }
  setFbLoading(true);
  try{
    const savedBisha = await fbGetOnce(BISHA_FB_PATH);
    currentBisha = (savedBisha && BILAHA.includes(savedBisha)) ? savedBisha : BILAHA[new Date().getMonth()];
    sel.value = currentBisha;
    const snap = await fbGetOnce(getFbPath(currentBisha));
    if(snap && typeof snap==="object"){
      appData = snap;
      Object.keys(DEFAULT_FASALADA).forEach(k=>{ if(!appData[k]) appData[k]=buildInitFarac()[k]; });
    }
  }catch{ appData=buildInitFarac(); }
  finally{ setFbLoading(false); }
  // Start real-time listener for current bisha
  startListener(currentBisha);
}

// Wait for Firebase SDK module to be ready
if(window._fbReady){
  appInit();
} else {
  window.addEventListener("fb-ready", appInit, {once:true});
}
</script>
