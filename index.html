<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EduAccounts Pro · Nidaamka Xisaabta Iskuulka</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a6b3c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EduAccounts" />
  <meta name="application-name" content="EduAccounts Pro" />
  <meta name="description" content="Nidaamka Xisaabta Iskuulka" />

  <!-- Apple Icons -->
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <!-- Safe area for notched phones -->
  <style>
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; }
    select option { background: #1e293b; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    input:focus, select:focus { border-color: #2ecc71 !important; box-shadow: 0 0 0 3px rgba(46,204,113,0.15); }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_ZgWHivBz_Z-_KbNiGrtTGU3R1Dtq7gw",
      authDomain: "alxikma-xisaabaad.firebaseapp.com",
      databaseURL: "https://alxikma-xisaabaad-default-rtdb.firebaseio.com",
      projectId: "alxikma-xisaabaad",
      storageBucket: "alxikma-xisaabaad.firebasestorage.app",
      messagingSenderId: "842183507563",
      appId: "1:842183507563:web:f197771bb6924a7ae07b2e",
      measurementId: "G-G4KTN9388C"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    window._fbDb  = db;
    window._fbRef = ref;
    window._fbSet = set;
    window._fbGet = get;
    window._fbOnValue = onValue;
    window._firebaseReady = true;
    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Data ──────────────────────────────────────────────────
    const INITIAL_SCHOOLS = [
      { id: 1, name: "Iskuulka Nuurta",  logo: null, color: "#1a6b3c", address: "Mogadishu, Somalia",  phone: "+252 61 000 0001" },
      { id: 2, name: "Iskuulka Hiddaha", logo: null, color: "#1a3b6b", address: "Bosaso, Somalia",     phone: "+252 61 000 0002" },
      { id: 3, name: "Iskuulka Iftiin",  logo: null, color: "#6b1a1a", address: "Hargeisa, Somalia",   phone: "+252 61 000 0003" },
      { id: 4, name: "Iskuulka Bariga",  logo: null, color: "#4a1a6b", address: "Kismayo, Somalia",    phone: "+252 61 000 0004" },
    ];
    const INITIAL_USERS = [
      { id: 1, name: "Admin Guud",      username: "admin",    password: "admin123", role: "admin",  schoolId: null, active: true },
      { id: 2, name: "Xasan Maxamed",   username: "xasan",    password: "pass123",  role: "editor", schoolId: 1,    active: true },
      { id: 3, name: "Faadumo Cabdi",   username: "faadumo",  password: "pass123",  role: "viewer", schoolId: 2,    active: true },
      { id: 4, name: "Cabdalle Nuur",   username: "cabdalle", password: "pass123",  role: "editor", schoolId: 3,    active: true },
    ];
    const INCOME_CATS  = ["Kharashka Dugsi","Deeqda Dowladda","Kaalmada Shirkadaha","Lacagaha Imtixaanka","Lacag Kale"];
    const EXPENSE_CATS = ["Mushahar Macallimiinta","Biyo & Korontada","Alaabta Dugsiga","Dayactirka","Gaadiidka","Kharash Kale"];
    const ROLE_META    = {
      admin:  { label:"Admin",  icon:"🔴", color:"#991b1b", bg:"#fef2f2" },
      editor: { label:"Editor", icon:"🟡", color:"#92400e", bg:"#fffbeb" },
      viewer: { label:"Viewer", icon:"🟢", color:"#166534", bg:"#f0fdf4" },
    };

    const genId  = () => Date.now() + Math.random();
    const fmt    = n => "SOS " + Number(n || 0).toLocaleString();
    const fmtD   = d => d ? new Date(d).toLocaleDateString("so-SO",{year:"numeric",month:"short",day:"numeric"}) : "—";
    const todayS = () => new Date().toISOString().split("T")[0];

    // ── Firebase + localStorage helpers ──────────────────────
    const fbPath = { edu_schools:"app/schools", edu_users:"app/users", edu_transactions:"app/transactions", edu_limits:"app/limits", edu_settings:"app/settings" };
    const fbSet = (k, v) => {
      if (!window._fbDb) return;
      window._fbSet(window._fbRef(window._fbDb, fbPath[k]||("app/"+k)), v).catch(err=>console.error("FB write:", err));
    };
    const load = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
    const save = (k, v)   => { try { localStorage.setItem(k, JSON.stringify(v)); fbSet(k, v); } catch {} };

    // ══════════════════════════════════════════════════════════
    //  ROOT APP
    // ══════════════════════════════════════════════════════════
    function App() {
      const [schools,      setSchoolsRaw]  = useState(() => load("edu_schools",      INITIAL_SCHOOLS));
      const [users,        setUsersRaw]    = useState(() => load("edu_users",        INITIAL_USERS));
      const [transactions, setTxRaw]       = useState(() => load("edu_transactions", []));
      const [limits,       setLimitsRaw]   = useState(() => load("edu_limits",       {}));
      const [settings,     setSettingsRaw] = useState(() => load("edu_settings",     { currency:"SOS", language:"Somali", fiscalYear:"2024", orgName:"Hay'adda Xisaabta" }));
      const [fbLoaded,     setFbLoaded]    = useState(false);

      // ── Firebase real-time sync + migration ───────────────
      useEffect(() => {
        const setupListeners = () => {
          if (!window._fbDb) return;

          // Migration: haddii Firebase empty yahay, localStorage xogta u dir
          const migrateToFirebase = async () => {
            const snap = await window._fbGet(window._fbRef(window._fbDb, "app"));
            if (!snap.exists()) {
              // Firebase empty — localStorage xogta u guri
              const migrations = [
                ["app/schools",      "edu_schools",      INITIAL_SCHOOLS],
                ["app/users",        "edu_users",        INITIAL_USERS],
                ["app/transactions", "edu_transactions", []],
                ["app/limits",       "edu_limits",       {}],
                ["app/settings",     "edu_settings",     { currency:"SOS", language:"Somali", fiscalYear:"2024", orgName:"Hay'adda Xisaabta" }],
              ];
              for (const [fbPath, lsKey, def] of migrations) {
                const lsVal = load(lsKey, def);
                await window._fbSet(window._fbRef(window._fbDb, fbPath), lsVal).catch(()=>{});
              }
              console.log("✅ Migration complete — xogta Firebase la diray");
            }
          };

          migrateToFirebase().then(() => {
            // Real-time listeners
            const paths = [
              ["app/schools",      v => { const d = Array.isArray(v)?v:Object.values(v||{}); setSchoolsRaw(d);  localStorage.setItem("edu_schools",      JSON.stringify(d)); }, INITIAL_SCHOOLS],
              ["app/users",        v => { const d = Array.isArray(v)?v:Object.values(v||{}); setUsersRaw(d);    localStorage.setItem("edu_users",        JSON.stringify(d)); }, INITIAL_USERS],
              ["app/transactions", v => { const d = Array.isArray(v)?v:Object.values(v||{}); setTxRaw(d);       localStorage.setItem("edu_transactions", JSON.stringify(d)); }, []],
              ["app/limits",       v => {                                                     setLimitsRaw(v);   localStorage.setItem("edu_limits",       JSON.stringify(v)); }, {}],
              ["app/settings",     v => {                                                     setSettingsRaw(v); localStorage.setItem("edu_settings",     JSON.stringify(v)); }, { currency:"SOS", language:"Somali", fiscalYear:"2024", orgName:"Hay'adda Xisaabta" }],
            ];
            paths.forEach(([path, setter, def]) => {
              const r = window._fbRef(window._fbDb, path);
              window._fbOnValue(r, snap => {
                setter(snap.exists() ? snap.val() : def);
                setFbLoaded(true);
              }, () => setFbLoaded(true));
            });
          });
        };

        if (window._firebaseReady) { setupListeners(); return; }
        const handler = () => setupListeners();
        window.addEventListener("firebaseReady", handler, { once: true });
        return () => window.removeEventListener("firebaseReady", handler);
      }, []);

      const setSchools      = v => { setSchoolsRaw(v);  save("edu_schools",      v); };
      const setUsers        = v => { setUsersRaw(v);    save("edu_users",        v); };
      const setTransactions = v => {
        // Firebase arrays ku kaydiya sida object — toos u beddel array
        const arr = Array.isArray(v) ? v : Object.values(v || {});
        setTxRaw(arr);
        save("edu_transactions", arr);
      };
      const setLimits       = v => { setLimitsRaw(v);   save("edu_limits",       v); };
      const setSettings     = v => { setSettingsRaw(v); save("edu_settings",     v); };

      const [currentUser,  setCurrentUser]  = useState(null);
      const [activeSchool, setActiveSchool] = useState(null);
      const [page,         setPage]         = useState("dashboard");
      const [loginForm,    setLoginForm]    = useState({ username:"", password:"" });
      const [loginError,   setLoginError]   = useState("");
      const [sidebarOpen,  setSidebarOpen]  = useState(true);
      const [notif,        setNotif]        = useState(null);
      const [isMobile,     setIsMobile]     = useState(() => window.innerWidth < 768);

      // Track screen size
      useEffect(() => {
        const handler = () => {
          const mobile = window.innerWidth < 768;
          setIsMobile(mobile);
          if (mobile) setSidebarOpen(false);
        };
        window.addEventListener("resize", handler);
        if (window.innerWidth < 768) setSidebarOpen(false);
        return () => window.removeEventListener("resize", handler);
      }, []);

      const notify = (msg, type="success") => {
        setNotif({ msg, type });
        setTimeout(() => setNotif(null), 3200);
      };

      const handleLogin = () => {
        const u = users.find(u => u.username === loginForm.username && u.password === loginForm.password && u.active);
        if (u) {
          setCurrentUser(u);
          setActiveSchool(u.schoolId ? schools.find(s => s.id === u.schoolId) : schools[0]);
          setPage("dashboard");
          setLoginError("");
        } else {
          setLoginError("Magaca isticmaalaha ama furaha xaga khaldan!");
        }
      };

      const handleLogout = () => { setCurrentUser(null); setActiveSchool(null); setPage("dashboard"); };
      const isAdmin = currentUser?.role === "admin";
      const canEdit = currentUser?.role === "admin" || currentUser?.role === "editor";
      const schoolTxs = transactions.filter(t => t.schoolId === activeSchool?.id);
      const totalIncome  = schoolTxs.filter(t => t.type === "income").reduce((a,b) => a + Number(b.amount), 0);
      const totalExpense = schoolTxs.filter(t => t.type === "expense").reduce((a,b) => a + Number(b.amount), 0);
      const balance = totalIncome - totalExpense;

      // ── LOADING (Firebase) ────────────────────────────────
      if (!fbLoaded && !load("edu_settings", null)) {
        return (
          <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f2027,#203a43,#2c5364)", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <div style={{ textAlign:"center", color:"#fff" }}>
              <div style={{ fontSize:56, marginBottom:20 }}>🔥</div>
              <div style={{ fontSize:18, fontWeight:800, marginBottom:8 }}>Firebase la xidhayaa...</div>
              <div style={{ fontSize:13, color:"#94a3b8" }}>Fadlan sug xogtaada waa la soo rarayo</div>
            </div>
          </div>
        );
      }

      // ── LOGIN ──────────────────────────────────────────────
      if (!currentUser) {
        return (
          <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0f2027,#203a43,#2c5364)", display:"flex", alignItems:"center", justifyContent:"center", padding:"16px" }}>
            <div style={{ background:"rgba(255,255,255,.97)", borderRadius:22, padding: isMobile ? "32px 24px" : "46px 40px", width:"100%", maxWidth:420, boxShadow:"0 30px 80px rgba(0,0,0,.4)" }}>
              <div style={{ textAlign:"center", marginBottom:30 }}>
                <div style={{ width:72, height:72, background:"linear-gradient(135deg,#1a6b3c,#2ecc71)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", fontSize:38, margin:"0 auto 14px" }}>📚</div>
                <h1 style={{ fontSize:24, fontWeight:900, color:"#1a2332" }}>EduAccounts Pro</h1>
                <p style={{ color:"#94a3b8", marginTop:5, fontSize:13 }}>Nidaamka Xisaabta Iskuulka</p>
              </div>
              {[["Magaca Isticmaalaha","username","text","admin"],["Furaha Sirta","password","password","••••••••"]].map(([l,k,t,ph]) => (
                <div key={k} style={{ marginBottom:14 }}>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:6 }}>{l}</label>
                  <input type={t} value={loginForm[k]} placeholder={ph}
                    onChange={e => setLoginForm(p => ({ ...p, [k]: e.target.value }))}
                    onKeyDown={e => e.key === "Enter" && handleLogin()}
                    style={{ width:"100%", padding:"11px 14px", border:"2px solid #e5e7eb", borderRadius:10, fontSize:14, outline:"none" }} />
                </div>
              ))}
              {loginError && <p style={{ color:"#e53e3e", fontSize:13, marginBottom:8 }}>{loginError}</p>}
              <button onClick={handleLogin}
                style={{ width:"100%", padding:"13px", background:"linear-gradient(135deg,#1a6b3c,#2ecc71)", color:"#fff", border:"none", borderRadius:10, fontSize:16, fontWeight:800, cursor:"pointer", marginTop:6 }}>
                Gal Nidaamka →
              </button>
              <div style={{ marginTop:18, padding:"12px 14px", background:"#f0fdf4", borderRadius:10, fontSize:12, color:"#166534", lineHeight:1.8 }}>
                <strong>Admin:</strong> admin / admin123 &nbsp;|&nbsp; <strong>Editor:</strong> xasan / pass123
              </div>
            </div>
          </div>
        );
      }

      // ── NAV ───────────────────────────────────────────────
      const navItems = [
        { id:"dashboard", icon:"🏠", label:"Guriga" },
        { id:"income",    icon:"💰", label:"Dakhliga" },
        { id:"expense",   icon:"💸", label:"Kharashaadka" },
        { id:"cashbook",  icon:"📒", label:"Buugga Lacagta" },
        { id:"reports",   icon:"📊", label:"Warbixinnada" },
        { id:"limits",    icon:"🎯", label:"Xaddiga" },
        ...(isAdmin ? [
          { id:"schools",  icon:"🏫", label:"Iskuullada" },
          { id:"users",    icon:"👥", label:"Isticmaalayaasha" },
          { id:"settings", icon:"⚙️", label:"Goobaha" },
        ] : []),
      ];
      const sc = activeSchool;
      const curNav = navItems.find(n => n.id === page);

      return (
        <div style={{ display:"flex", minHeight:"100vh", fontFamily:"'Segoe UI',Arial,sans-serif", background:"#f1f5f9" }}>

          {/* Notification */}
          {notif && (
            <div style={{ position:"fixed", top:16, left:"50%", transform:"translateX(-50%)", zIndex:9999, background: notif.type==="success"?"#166534":"#9b1c1c", color:"#fff", padding:"12px 22px", borderRadius:12, boxShadow:"0 8px 30px rgba(0,0,0,.25)", fontSize:14, fontWeight:700, whiteSpace:"nowrap" }}>
              {notif.type==="success"?"✅":"❌"} {notif.msg}
            </div>
          )}

          {/* ── SIDEBAR (desktop only) ───────────────────────── */}
          {!isMobile && (
            <div style={{ width: sidebarOpen ? 248 : 68, background:"linear-gradient(180deg,#0f172a,#1e293b)", transition:"width .3s", overflow:"hidden", display:"flex", flexDirection:"column", flexShrink:0, boxShadow:"4px 0 20px rgba(0,0,0,.3)" }}>
              <div style={{ padding:"18px 14px", borderBottom:"1px solid rgba(255,255,255,.08)", display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ width:40, height:40, background: sc ? sc.color : "#1a6b3c", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0, overflow:"hidden" }}>
                  {sc?.logo ? <img src={sc.logo} style={{ width:40, height:40, objectFit:"cover" }} /> : "🏫"}
                </div>
                {sidebarOpen && (
                  <div style={{ overflow:"hidden" }}>
                    <div style={{ color:"#fff", fontWeight:800, fontSize:13, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:165 }}>{sc?.name || "EduAccounts"}</div>
                    <div style={{ color:"#64748b", fontSize:11 }}>Pro Edition</div>
                  </div>
                )}
              </div>
              {isAdmin && sidebarOpen && (
                <div style={{ padding:"10px 14px", borderBottom:"1px solid rgba(255,255,255,.06)" }}>
                  <select value={activeSchool?.id || ""} onChange={e => setActiveSchool(schools.find(s => s.id === Number(e.target.value)))}
                    style={{ width:"100%", padding:"7px 10px", background:"rgba(255,255,255,.08)", color:"#e2e8f0", border:"1px solid rgba(255,255,255,.12)", borderRadius:8, fontSize:12, outline:"none" }}>
                    {schools.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
              )}
              <nav style={{ flex:1, padding:"10px 0" }}>
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setPage(item.id)}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:12, padding:"11px 14px", background: page===item.id ? "rgba(46,204,113,.18)" : "transparent", border:"none", cursor:"pointer", color: page===item.id ? "#2ecc71" : "#94a3b8", fontSize:13, fontWeight: page===item.id ? 700 : 400, borderLeft: page===item.id ? "3px solid #2ecc71" : "3px solid transparent", textAlign:"left" }}>
                    <span style={{ fontSize:18, flexShrink:0 }}>{item.icon}</span>
                    {sidebarOpen && <span style={{ whiteSpace:"nowrap" }}>{item.label}</span>}
                  </button>
                ))}
              </nav>
              <div style={{ padding:"12px 14px", borderTop:"1px solid rgba(255,255,255,.08)" }}>
                {sidebarOpen && (
                  <div style={{ marginBottom:8 }}>
                    <div style={{ color:"#e2e8f0", fontWeight:700, fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{currentUser.name}</div>
                    <div style={{ color:"#64748b", fontSize:11 }}>{ROLE_META[currentUser.role]?.icon} {ROLE_META[currentUser.role]?.label}</div>
                  </div>
                )}
                <button onClick={handleLogout}
                  style={{ width:"100%", padding:"8px", background:"rgba(239,68,68,.15)", color:"#f87171", border:"1px solid rgba(239,68,68,.25)", borderRadius:8, cursor:"pointer", fontSize:12, fontWeight:700 }}>
                  {sidebarOpen ? "🚪 Ka Bax" : "🚪"}
                </button>
              </div>
            </div>
          )}

          {/* ── MAIN ──────────────────────────────────────────── */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0, paddingBottom: isMobile ? 70 : 0 }}>

            {/* Topbar */}
            <div style={{ background:"#fff", padding: isMobile ? "12px 16px" : "13px 22px", display:"flex", alignItems:"center", gap:10, borderBottom:"1px solid #e5e7eb", position:"sticky", top:0, zIndex:100, boxShadow:"0 1px 6px rgba(0,0,0,.05)" }}>
              {!isMobile && <button onClick={() => setSidebarOpen(p => !p)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:22, color:"#64748b", padding:0 }}>☰</button>}
              {isMobile && (
                <div style={{ width:32, height:32, background: sc ? sc.color : "#1a6b3c", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>
                  {sc?.logo ? <img src={sc.logo} style={{ width:32, height:32, objectFit:"cover", borderRadius:8 }} /> : "🏫"}
                </div>
              )}
              <div style={{ flex:1, minWidth:0 }}>
                <h2 style={{ fontSize: isMobile ? 15 : 17, fontWeight:800, color:"#1e293b", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{curNav?.icon} {curNav?.label}</h2>
                {!isMobile && <p style={{ fontSize:11, color:"#94a3b8", marginTop:2 }}>{sc?.name} · {new Date().toLocaleDateString("so-SO")}</p>}
              </div>
              <span style={{ padding:"5px 10px", background: balance>=0?"#f0fdf4":"#fef2f2", color: balance>=0?"#166534":"#991b1b", borderRadius:20, fontSize:11, fontWeight:800, whiteSpace:"nowrap" }}>
                {balance>=0?"✅":"⚠️"} {fmt(balance)}
              </span>
              <button id="pwa-install-btn" onClick={() => window._installPWA && window._installPWA()}
                style={{ display:"none", alignItems:"center", gap:6, padding:"7px 14px", background:"linear-gradient(135deg,#1a6b3c,#2ecc71)", color:"#fff", border:"none", borderRadius:20, cursor:"pointer", fontSize:12, fontWeight:800, whiteSpace:"nowrap" }}>
                📲
              </button>
            </div>

            {/* Content */}
            <div style={{ flex:1, padding: isMobile ? 14 : 22, overflowY:"auto" }}>
              {page==="dashboard" && <DashboardPage schools={schools} transactions={transactions} activeSchool={activeSchool} totalIncome={totalIncome} totalExpense={totalExpense} balance={balance} setPage={setPage} limits={limits} isMobile={isMobile} />}
              {page==="income"    && <TxPage type="income"  transactions={schoolTxs} allTransactions={transactions} setTransactions={setTransactions} activeSchool={activeSchool} canEdit={canEdit} cats={INCOME_CATS}  notify={notify} limits={limits} isMobile={isMobile} />}
              {page==="expense"   && <TxPage type="expense" transactions={schoolTxs} allTransactions={transactions} setTransactions={setTransactions} activeSchool={activeSchool} canEdit={canEdit} cats={EXPENSE_CATS} notify={notify} limits={limits} isMobile={isMobile} />}
              {page==="cashbook"  && <CashBookPage transactions={schoolTxs} activeSchool={activeSchool} notify={notify} isMobile={isMobile} />}
              {page==="reports"   && <ReportsPage  transactions={schoolTxs} activeSchool={activeSchool} notify={notify} isMobile={isMobile} />}
              {page==="limits"    && <LimitsPage   limits={limits} setLimits={setLimits} activeSchool={activeSchool} canEdit={canEdit} notify={notify} />}
              {page==="schools"  && isAdmin && <SchoolsPage  schools={schools}  setSchools={setSchools}   notify={notify} />}
              {page==="users"    && isAdmin && <UsersPage    users={users}      setUsers={setUsers}       schools={schools} notify={notify} currentUser={currentUser} />}
              {page==="settings" && isAdmin && <SettingsPage settings={settings} setSettings={setSettings} notify={notify} currentUser={currentUser} setUsers={setUsers} users={users} />}
            </div>
          </div>

          {/* ── BOTTOM NAV (mobile only) ─────────────────────── */}
          {isMobile && (
            <div style={{ position:"fixed", bottom:0, left:0, right:0, background:"#0f172a", borderTop:"1px solid rgba(255,255,255,.1)", display:"flex", zIndex:200, paddingBottom:"env(safe-area-inset-bottom)" }}>
              {navItems.slice(0, 5).map(item => (
                <button key={item.id} onClick={() => setPage(item.id)}
                  style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"10px 4px 8px", background:"transparent", border:"none", cursor:"pointer", color: page===item.id ? "#2ecc71" : "#64748b", gap:3 }}>
                  <span style={{ fontSize:20 }}>{item.icon}</span>
                  <span style={{ fontSize:9, fontWeight: page===item.id ? 800 : 400, whiteSpace:"nowrap" }}>{item.label}</span>
                  {page===item.id && <div style={{ width:16, height:2, background:"#2ecc71", borderRadius:2 }} />}
                </button>
              ))}
              {/* More button for extra pages */}
              <button onClick={() => setPage(navItems[5]?.id || "limits")}
                style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"10px 4px 8px", background:"transparent", border:"none", cursor:"pointer", color: !navItems.slice(0,5).find(n=>n.id===page) ? "#2ecc71" : "#64748b", gap:3 }}>
                <span style={{ fontSize:20 }}>⋯</span>
                <span style={{ fontSize:9, fontWeight:400 }}>Dheeraad</span>
                {!navItems.slice(0,5).find(n=>n.id===page) && <div style={{ width:16, height:2, background:"#2ecc71", borderRadius:2 }} />}
              </button>
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  DASHBOARD
    // ══════════════════════════════════════════════════════════
    function DashboardPage({ schools, transactions, activeSchool, totalIncome, totalExpense, balance, setPage, limits, isMobile }) {

      // Current month filter
      const nowMonth = new Date().toISOString().substring(0,7); // "2026-05"
      const [selMonth,    setSelMonth]    = useState(nowMonth);
      const [selectedIds, setSelectedIds] = useState(() => schools.map(s => s.id)); // all selected by default
      const [showPicker,  setShowPicker]  = useState(false);

      // Toggle single school
      const toggleSchool = id => {
        setSelectedIds(prev =>
          prev.includes(id) ? (prev.length > 1 ? prev.filter(x => x !== id) : prev) : [...prev, id]
        );
      };
      const selectAll  = () => setSelectedIds(schools.map(s => s.id));
      const clearAll   = () => setSelectedIds([schools[0]?.id].filter(Boolean));

      // Aggregate transactions for selected schools + selected month
      const filteredTxs = transactions.filter(t =>
        selectedIds.includes(t.schoolId) && t.date?.startsWith(selMonth)
      );
      const aggInc = filteredTxs.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount),0);
      const aggExp = filteredTxs.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount),0);
      const aggBal = aggInc - aggExp;

      // Chart — monthly data for selected schools
      const chartTxs = transactions.filter(t => selectedIds.includes(t.schoolId));
      const monthlyData = {};
      chartTxs.forEach(t => {
        const m = t.date?.substring(0,7);
        if (!m) return;
        if (!monthlyData[m]) monthlyData[m] = { income:0, expense:0 };
        monthlyData[m][t.type] += Number(t.amount);
      });

      // Per-school stats for selected month
      const schoolStats = schools.map(s => {
        const st = transactions.filter(t => t.schoolId===s.id && t.date?.startsWith(selMonth));
        return { ...s,
          inc: st.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount),0),
          exp: st.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount),0),
          selected: selectedIds.includes(s.id)
        };
      });

      const selSchoolNames = schools.filter(s=>selectedIds.includes(s.id)).map(s=>s.name).join(", ");
      const monthLabel = new Date(selMonth+"-01").toLocaleString("so-SO",{month:"long",year:"numeric"});

      const aggCards = [
        { label:"Wadarta Dakhliga",    value:fmt(aggInc), icon:"💰", color:"#166534", bg:"#f0fdf4" },
        { label:"Wadarta Kharashaadka",value:fmt(aggExp), icon:"💸", color:"#991b1b", bg:"#fef2f2" },
        { label:"Haraaga (Balance)",   value:fmt(aggBal), icon:"🏦", color:aggBal>=0?"#1d4ed8":"#991b1b", bg:aggBal>=0?"#eff6ff":"#fef2f2" },
        { label:"Diiwaangelinta",      value:filteredTxs.length, icon:"📝", color:"#7c3aed", bg:"#faf5ff" },
      ];

      return (
        <div>
          {/* ── Filter Bar ───────────────────────────────── */}
          <div style={{ background:"#fff", borderRadius:14, padding:"14px 18px", marginBottom:18, border:"1px solid #e5e7eb", display:"flex", gap:12, alignItems:"center", flexWrap:"wrap" }}>
            {/* Month picker */}
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:13, fontWeight:700, color:"#374151" }}>📅 Bisha:</span>
              <input type="month" value={selMonth} onChange={e=>setSelMonth(e.target.value)}
                style={{ padding:"7px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:13, outline:"none", fontWeight:600 }} />
            </div>

            <div style={{ width:1, height:32, background:"#e5e7eb" }} />

            {/* School multi-picker */}
            <div style={{ position:"relative" }}>
              <button onClick={()=>setShowPicker(p=>!p)}
                style={{ padding:"7px 14px", background: showPicker?"#0f172a":"#f8fafc", color: showPicker?"#fff":"#374151", border:"1.5px solid #e5e7eb", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13, display:"flex", alignItems:"center", gap:8 }}>
                🏫 Iskuullada ({selectedIds.length}/{schools.length}) {showPicker?"▲":"▼"}
              </button>

              {showPicker && (
                <div style={{ position:"absolute", top:"calc(100% + 8px)", left:0, background:"#fff", borderRadius:12, boxShadow:"0 8px 40px rgba(0,0,0,.18)", border:"1px solid #e5e7eb", zIndex:200, minWidth:260, padding:12 }}>
                  <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                    <button onClick={selectAll} style={{ flex:1, padding:"6px", background:"#f0fdf4", color:"#166534", border:"1px solid #bbf7d0", borderRadius:7, cursor:"pointer", fontSize:12, fontWeight:700 }}>✅ Dhammaan</button>
                    <button onClick={clearAll}  style={{ flex:1, padding:"6px", background:"#fef2f2", color:"#991b1b", border:"1px solid #fecaca", borderRadius:7, cursor:"pointer", fontSize:12, fontWeight:700 }}>✕ Nadiifi</button>
                  </div>
                  {schools.map(s => {
                    const isSel = selectedIds.includes(s.id);
                    return (
                      <div key={s.id} onClick={()=>toggleSchool(s.id)}
                        style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:9, cursor:"pointer", marginBottom:4, background: isSel?"#f0fdf4":"#f8fafc", border:`1.5px solid ${isSel?s.color+"66":"#e5e7eb"}`, transition:"all .15s" }}>
                        <div style={{ width:14, height:14, borderRadius:4, background: isSel?s.color:"#e5e7eb", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                          {isSel && <span style={{ color:"#fff", fontSize:10, lineHeight:1 }}>✓</span>}
                        </div>
                        <div style={{ width:10, height:10, borderRadius:"50%", background:s.color, flexShrink:0 }} />
                        <span style={{ fontSize:13, fontWeight: isSel?700:400, color:"#1e293b" }}>{s.name}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Summary pill */}
            <div style={{ marginLeft:"auto", padding:"7px 14px", background:"linear-gradient(135deg,#0f172a,#1e293b)", borderRadius:20, fontSize:12, color:"#94a3b8", display:"flex", gap:10 }}>
              <span style={{ color:"#2ecc71", fontWeight:700 }}>💰 {fmt(aggInc)}</span>
              <span style={{ color:"#f87171", fontWeight:700 }}>💸 {fmt(aggExp)}</span>
              <span style={{ color: aggBal>=0?"#60a5fa":"#fb923c", fontWeight:700 }}>🏦 {fmt(aggBal)}</span>
            </div>
          </div>

          {/* ── Aggregate label ───────────────────────────── */}
          <div style={{ marginBottom:14, padding:"10px 16px", background:"linear-gradient(90deg,#0f172a,#1e293b)", borderRadius:10, display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:13, color:"#94a3b8" }}>📊 Xisaabta:</span>
            <span style={{ fontSize:13, fontWeight:800, color:"#e2e8f0" }}>{monthLabel}</span>
            <span style={{ fontSize:12, color:"#64748b" }}>·</span>
            <span style={{ fontSize:12, color:"#64748b", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:500 }}>{selSchoolNames}</span>
          </div>

          {/* ── Agg Cards ────────────────────────────────── */}
          <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4,1fr)", gap:14, marginBottom:20 }}>
            {aggCards.map((c,i) => (
              <div key={i} style={{ background:c.bg, borderRadius:14, padding:"18px 20px", border:`1px solid ${c.color}22` }}>
                <div style={{ fontSize:28, marginBottom:6 }}>{c.icon}</div>
                <div style={{ fontSize:22, fontWeight:900, color:c.color }}>{c.value}</div>
                <div style={{ fontSize:12, color:"#64748b", marginTop:3 }}>{c.label}</div>
              </div>
            ))}
          </div>

          {/* ── Chart + Per-school table ──────────────────── */}
          <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "2fr 1fr", gap:16 }}>

            {/* Chart */}
            <div style={{ background:"#fff", borderRadius:14, padding:22, border:"1px solid #e5e7eb" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                <h3 style={{ fontSize:14, fontWeight:800, color:"#1e293b" }}>📊 Geeddi-socodka (Bilaha)</h3>
                <button onClick={()=>setPage("cashbook")} style={{ fontSize:12, color:"#2ecc71", background:"none", border:"none", cursor:"pointer", fontWeight:700 }}>Cashbook →</button>
              </div>
              {Object.keys(monthlyData).length === 0
                ? <div style={{ textAlign:"center", color:"#94a3b8", padding:40 }}>Wali xog ma jirto</div>
                : (
                  <div>
                    <div style={{ display:"flex", gap:5, alignItems:"flex-end", height:140, marginBottom:8 }}>
                      {Object.entries(monthlyData).sort().map(([m,d]) => {
                        const max = Math.max(...Object.values(monthlyData).map(x => Math.max(x.income||1, x.expense||1)));
                        const isCurrent = m === selMonth;
                        return (
                          <div key={m} onClick={()=>setSelMonth(m)} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2, cursor:"pointer" }}>
                            <div style={{ width:"100%", display:"flex", gap:2, alignItems:"flex-end", height:110 }}>
                              <div style={{ flex:1, background: isCurrent?"#16a34a":"#2ecc71", borderRadius:"4px 4px 0 0", height:`${(d.income/max)*100}%`, minHeight:4, opacity: isCurrent?1:.7, transition:"all .2s" }} title={`Dakhli: ${fmt(d.income)}`} />
                              <div style={{ flex:1, background: isCurrent?"#dc2626":"#ef4444", borderRadius:"4px 4px 0 0", height:`${(d.expense/max)*100}%`, minHeight:4, opacity: isCurrent?1:.7, transition:"all .2s" }} title={`Kharash: ${fmt(d.expense)}`} />
                            </div>
                            <div style={{ fontSize:9, color: isCurrent?"#1e293b":"#94a3b8", fontWeight: isCurrent?800:400 }}>{m.substring(5)}</div>
                            {isCurrent && <div style={{ width:6, height:6, borderRadius:"50%", background:"#2ecc71" }} />}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display:"flex", gap:16 }}>
                      <span style={{ fontSize:12, color:"#166534" }}>🟩 Dakhli</span>
                      <span style={{ fontSize:12, color:"#991b1b" }}>🟥 Kharash</span>
                      <span style={{ fontSize:11, color:"#94a3b8" }}>· Guji bar si aad bisha u dooratid</span>
                    </div>
                  </div>
                )}
            </div>

            {/* Per-school breakdown for selected month */}
            <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
              <div style={{ padding:"14px 16px", borderBottom:"1px solid #e5e7eb", background:"#f8fafc", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <h3 style={{ fontSize:13, fontWeight:800, color:"#1e293b" }}>🏫 Kala-soocida Bisheed</h3>
                <span style={{ fontSize:11, color:"#94a3b8" }}>{monthLabel}</span>
              </div>
              <div style={{ padding:"10px 14px" }}>
                {/* Totals row */}
                <div style={{ padding:"10px 12px", background:"linear-gradient(135deg,#0f172a,#1e293b)", borderRadius:10, marginBottom:12 }}>
                  <div style={{ fontSize:11, color:"#64748b", marginBottom:4, fontWeight:700 }}>WADAR GUUD ({selectedIds.length} iskuul)</div>
                  <div style={{ display:"flex", gap:12 }}>
                    <div>
                      <div style={{ fontSize:10, color:"#94a3b8" }}>Dakhli</div>
                      <div style={{ fontSize:14, fontWeight:900, color:"#2ecc71" }}>{fmt(aggInc)}</div>
                    </div>
                    <div>
                      <div style={{ fontSize:10, color:"#94a3b8" }}>Kharash</div>
                      <div style={{ fontSize:14, fontWeight:900, color:"#f87171" }}>{fmt(aggExp)}</div>
                    </div>
                    <div>
                      <div style={{ fontSize:10, color:"#94a3b8" }}>Haraaga</div>
                      <div style={{ fontSize:14, fontWeight:900, color: aggBal>=0?"#60a5fa":"#fb923c" }}>{fmt(aggBal)}</div>
                    </div>
                  </div>
                </div>

                {/* Individual schools */}
                {schoolStats.map(s => {
                  const bal = s.inc - s.exp;
                  const hasData = s.inc > 0 || s.exp > 0;
                  return (
                    <div key={s.id} onClick={()=>toggleSchool(s.id)}
                      style={{ marginBottom:8, padding:"9px 11px", background: s.selected?"#f8fafc":"#fdfdfd", borderRadius:10, borderLeft:`4px solid ${s.selected?s.color:"#e5e7eb"}`, opacity: s.selected?1:.45, cursor:"pointer", transition:"all .2s" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: hasData?4:0 }}>
                        <div style={{ fontWeight:700, fontSize:12, color:"#1e293b" }}>{s.name}</div>
                        {s.selected
                          ? <span style={{ fontSize:10, background: s.color+"22", color:s.color, padding:"1px 6px", borderRadius:6, fontWeight:700 }}>✓</span>
                          : <span style={{ fontSize:10, color:"#94a3b8" }}>—</span>}
                      </div>
                      {hasData && (
                        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:4 }}>
                          <div style={{ fontSize:10, color:"#166534", fontWeight:700 }}>💰 {fmt(s.inc)}</div>
                          <div style={{ fontSize:10, color:"#991b1b", fontWeight:700 }}>💸 {fmt(s.exp)}</div>
                          <div style={{ fontSize:10, color: bal>=0?"#1d4ed8":"#991b1b", fontWeight:700 }}>🏦 {fmt(bal)}</div>
                        </div>
                      )}
                      {!hasData && <div style={{ fontSize:10, color:"#cbd5e1" }}>Xog ma jirto bisha</div>}
                    </div>
                  );
                })}
                <div style={{ fontSize:11, color:"#94a3b8", textAlign:"center", marginTop:6 }}>Guji iskuul si aad u dooratid</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  TRANSACTIONS
    // ══════════════════════════════════════════════════════════
    function TxPage({ type, transactions, allTransactions, setTransactions, activeSchool, canEdit, cats, notify, limits, isMobile }) {
      const [showForm, setShowForm] = useState(false);
      const [editId,   setEditId]   = useState(null);
      const [form,     setForm]     = useState({ date:todayS(), category:cats[0], amount:"", description:"", ref:"" });
      const [search,   setSearch]   = useState("");

      const isIncome   = type === "income";
      const accent     = isIncome ? "#166534" : "#991b1b";
      const accentBg   = isIncome ? "#f0fdf4"  : "#fef2f2";
      const allTxs     = transactions.filter(t => t.type === type);
      const total      = allTxs.reduce((a,b) => a+Number(b.amount), 0);
      const limitKey   = `${type}_${activeSchool?.id}`;
      const limitVal   = limits[limitKey];
      const overLimit  = limitVal && total > limitVal;

      const filtered = allTxs
        .filter(t => !search || [t.description,t.category,t.ref].some(v => v?.toLowerCase().includes(search.toLowerCase())))
        .sort((a,b) => (b.date||"").localeCompare(a.date||""));

      const resetForm = () => { setForm({ date:todayS(), category:cats[0], amount:"", description:"", ref:"" }); setEditId(null); setShowForm(false); };

      const handleSave = () => {
        if (!form.amount || isNaN(form.amount)) return notify("Xaddiga geli si sax ah","error");
        const entry = { ...form, amount:Number(form.amount), type, schoolId:activeSchool.id };
        if (editId) {
          const updated = (allTransactions||[]).map(t => t.id===editId ? { ...t, ...entry } : t);
          setTransactions(updated);
          notify("Waa la cusbooneysiiyey ✅");
        } else {
          const newTx = { id:genId(), ...entry, createdAt:new Date().toISOString() };
          setTransactions([...(allTransactions||[]), newTx]);
          notify(isIncome ? "Dakhliga waa la geliyey ✅" : "Kharashaadka waa la geliyey ✅");
        }
        resetForm();
      };

      const handleEdit   = t => { setForm({ date:t.date, category:t.category, amount:t.amount, description:t.description||"", ref:t.ref||"" }); setEditId(t.id); setShowForm(true); };
      const handleDelete = id => { if (window.confirm("Sidaad u tirtiraysaa?")) { setTransactions((allTransactions||[]).filter(t => t.id!==id)); notify("Waa la tirtirtay","error"); } };

      return (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:18 }}>
            <div>
              <div style={{ fontSize:26, fontWeight:900, color:accent }}>{fmt(total)}</div>
              <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>Wadarta {isIncome?"Dakhliga":"Kharashaadka"} · {allTxs.length} diiwaangelin</div>
              {limitVal && (
                <div style={{ fontSize:12, marginTop:4, color: overLimit?"#991b1b":"#166534", fontWeight:700 }}>
                  {overLimit ? "⚠️ Xaddiga waad dhaaftay!" : `✅ Xaddi: ${fmt(limitVal)} · Haray: ${fmt(limitVal-total)}`}
                </div>
              )}
            </div>
            {canEdit && (
              <button onClick={() => { resetForm(); setShowForm(true); }}
                style={{ padding:"10px 20px", background:accent, color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800, fontSize:14 }}>
                + {isIncome ? "Dakhli Cusub" : "Kharash Cusub"}
              </button>
            )}
          </div>

          {showForm && canEdit && (
            <div style={{ background:"#fff", borderRadius:14, padding:22, marginBottom:18, border:`2px solid ${accent}22` }}>
              <h3 style={{ marginBottom:16, color:accent, fontSize:15 }}>{editId ? "✏️ Wax Ka Beddel" : isIncome ? "💰 Dakhli Cusub" : "💸 Kharash Cusub"}</h3>
              <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "1fr 1fr 1fr", gap:12 }}>
                {[["date","Taariikhda","date"],["amount","Xaddiga (SOS)","number"],["ref","Tixraaca / Ref","text"]].map(([k,l,t]) => (
                  <div key={k}>
                    <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>{l}</label>
                    <input type={t} value={form[k]} onChange={e => setForm(p=>({...p,[k]:e.target.value}))}
                      style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                  </div>
                ))}
                <div>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Nooca</label>
                  <select value={form.category} onChange={e => setForm(p=>({...p,category:e.target.value}))}
                    style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }}>
                    {cats.map(c => <option key={c}>{c}</option>)}
                  </select>
                </div>
                <div style={{ gridColumn:"span 2" }}>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Sharaxaadda</label>
                  <input value={form.description} onChange={e => setForm(p=>({...p,description:e.target.value}))} placeholder="Faahfaahin..."
                    style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                </div>
              </div>
              <div style={{ display:"flex", gap:10, marginTop:14 }}>
                <button onClick={handleSave} style={{ padding:"10px 24px", background:accent, color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800 }}>
                  {editId ? "💾 Xifaali" : "✅ Kaydi"}
                </button>
                <button onClick={resetForm} style={{ padding:"10px 16px", background:"#f1f5f9", color:"#64748b", border:"none", borderRadius:8, cursor:"pointer" }}>Jooji</button>
              </div>
            </div>
          )}

          <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
            <div style={{ padding:"14px 18px", borderBottom:"1px solid #f1f5f9", display:"flex", gap:10, alignItems:"center" }}>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍 Raadi…"
                style={{ flex:1, padding:"9px 14px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:13, outline:"none" }} />
              <span style={{ padding:"9px 14px", background:accentBg, color:accent, borderRadius:8, fontSize:12, fontWeight:700, whiteSpace:"nowrap" }}>{filtered.length} diiwaangelin</span>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:"#f8fafc" }}>
                    {["Taariikh","Ref","Nooca","Sharaxaad","Xaddi",""].map((h,i) => (
                      <th key={i} style={{ padding:"11px 14px", textAlign:"left", fontSize:11, fontWeight:800, color:"#64748b", borderBottom:"1px solid #e5e7eb", textTransform:"uppercase" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0
                    ? <tr><td colSpan={6} style={{ padding:40, textAlign:"center", color:"#94a3b8" }}>Xog ma jirto</td></tr>
                    : filtered.map(t => (
                      <tr key={t.id} style={{ borderBottom:"1px solid #f8fafc" }}>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtD(t.date)}</td>
                        <td style={{ padding:"11px 14px", fontSize:12, color:"#94a3b8", fontFamily:"monospace" }}>{t.ref||"—"}</td>
                        <td style={{ padding:"11px 14px" }}><span style={{ padding:"3px 9px", background:accentBg, color:accent, borderRadius:20, fontSize:11, fontWeight:700 }}>{t.category}</span></td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{t.description||"—"}</td>
                        <td style={{ padding:"11px 14px", fontWeight:900, color:accent, fontSize:15 }}>{fmt(t.amount)}</td>
                        <td style={{ padding:"11px 14px" }}>
                          {canEdit && (
                            <div style={{ display:"flex", gap:6 }}>
                              <button onClick={() => handleEdit(t)} style={{ padding:"4px 10px", background:"#eff6ff", color:"#1d4ed8", border:"none", borderRadius:6, cursor:"pointer", fontSize:12 }}>✏️</button>
                              <button onClick={() => handleDelete(t.id)} style={{ padding:"4px 10px", background:"#fef2f2", color:"#991b1b", border:"none", borderRadius:6, cursor:"pointer", fontSize:12 }}>🗑️</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  CASHBOOK
    // ══════════════════════════════════════════════════════════
    function CashBookPage({ transactions, activeSchool, notify }) {
      const [filterMonth, setFilterMonth] = useState("");

      const sorted   = [...transactions].sort((a,b) => (a.date||"").localeCompare(b.date||""));
      const filtered = filterMonth ? sorted.filter(t => t.date?.startsWith(filterMonth)) : sorted;

      let running = 0;
      const rows = filtered.map(t => {
        const isInc = t.type === "income";
        running += isInc ? Number(t.amount) : -Number(t.amount);
        return { ...t, running, isInc };
      });

      const totalInc = rows.filter(r=>r.isInc).reduce((a,b)=>a+Number(b.amount),0);
      const totalExp = rows.filter(r=>!r.isInc).reduce((a,b)=>a+Number(b.amount),0);

      const handlePrint = () => {
        const sc = activeSchool;
        const html = `<html><head><title>Buugga Lacagta · ${sc?.name}</title>
        <style>body{font-family:Arial;margin:28px;font-size:13px;}h1{color:#1a6b3c;text-align:center;margin:0 0 4px;}h2{text-align:center;color:#333;font-size:15px;margin:0;}p{text-align:center;color:#666;font-size:12px;margin:4px 0 0;}table{width:100%;border-collapse:collapse;margin-top:16px;}th{background:#1a6b3c;color:#fff;padding:9px 8px;text-align:left;font-size:12px;}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:12px;}.inc{color:#166534;font-weight:700;}.exp{color:#991b1b;font-weight:700;}.tot{background:#f0fdf4;font-weight:800;}@media print{button{display:none}}</style>
        </head><body>
        <h1>📒 Buugga Lacagta (Cash Book)</h1>
        <h2>${sc?.name}</h2>
        <p>${filterMonth ? "Bisha: "+filterMonth : "Dhammaan Wakhtiyada"} | La daabacay: ${new Date().toLocaleDateString()}</p>
        <table><tr><th>Taariikh</th><th>Ref</th><th>Sharaxaad</th><th>Nooca</th><th>Dakhli</th><th>Kharash</th><th>Haraaga</th></tr>
        ${rows.map(r=>`<tr><td>${fmtD(r.date)}</td><td>${r.ref||"—"}</td><td>${r.description||"—"}</td><td>${r.category}</td><td class="inc">${r.isInc?fmt(r.amount):""}</td><td class="exp">${!r.isInc?fmt(r.amount):""}</td><td style="font-weight:800;color:${r.running>=0?"#166534":"#991b1b"}">${fmt(r.running)}</td></tr>`).join("")}
        <tr class="tot"><td colspan="4">WADARTA</td><td class="inc">${fmt(totalInc)}</td><td class="exp">${fmt(totalExp)}</td><td>${fmt(running)}</td></tr>
        </table></body></html>`;
        const w = window.open("","_blank"); w.document.write(html); w.document.close(); w.print();
        notify("PDF la daabacayaa ✅");
      };

      return (
        <div>
          <div style={{ display:"flex", gap:10, marginBottom:18, alignItems:"center", flexWrap:"wrap" }}>
            <input type="month" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)}
              style={{ padding:"9px 14px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
            {filterMonth && <button onClick={()=>setFilterMonth("")} style={{ padding:"9px 12px", background:"#f1f5f9", border:"none", borderRadius:8, cursor:"pointer" }}>✕</button>}
            <div style={{ flex:1 }} />
            <button onClick={handlePrint} style={{ padding:"9px 20px", background:"#1a6b3c", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800 }}>🖨️ Daabac PDF</button>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:18 }}>
            {[{l:"Dakhli",v:totalInc,c:"#166534",bg:"#f0fdf4"},{l:"Kharash",v:totalExp,c:"#991b1b",bg:"#fef2f2"},{l:"Haraaga",v:running,c:running>=0?"#1d4ed8":"#991b1b",bg:running>=0?"#eff6ff":"#fef2f2"}].map((x,i)=>(
              <div key={i} style={{ background:x.bg, borderRadius:12, padding:"16px 18px" }}>
                <div style={{ fontSize:20, fontWeight:900, color:x.c }}>{fmt(x.v)}</div>
                <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>{x.l}</div>
              </div>
            ))}
          </div>

          <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
            <div style={{ padding:"14px 18px", background:"#f8fafc", borderBottom:"1px solid #e5e7eb" }}>
              <h3 style={{ fontSize:14, fontWeight:800, color:"#1e293b" }}>📒 {activeSchool?.name} · Buugga Lacagta</h3>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:"#1a6b3c" }}>
                    {["Taariikh","Ref","Sharaxaad","Nooca","Dakhli","Kharash","Haraaga"].map((h,i) => (
                      <th key={i} style={{ padding:"11px 13px", textAlign:"left", fontSize:11, fontWeight:800, color:"#fff" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.length === 0
                    ? <tr><td colSpan={7} style={{ padding:40, textAlign:"center", color:"#94a3b8" }}>Xog ma jirto</td></tr>
                    : rows.map((r,i) => (
                      <tr key={r.id} style={{ background: i%2===0?"#fff":"#f8fafc", borderBottom:"1px solid #f1f5f9" }}>
                        <td style={{ padding:"9px 13px", fontSize:12 }}>{fmtD(r.date)}</td>
                        <td style={{ padding:"9px 13px", fontSize:11, color:"#94a3b8", fontFamily:"monospace" }}>{r.ref||"—"}</td>
                        <td style={{ padding:"9px 13px", fontSize:12 }}>{r.description||r.category}</td>
                        <td style={{ padding:"9px 13px" }}><span style={{ fontSize:10, padding:"2px 7px", background: r.isInc?"#f0fdf4":"#fef2f2", color: r.isInc?"#166534":"#991b1b", borderRadius:10 }}>{r.category}</span></td>
                        <td style={{ padding:"9px 13px", color:"#166534", fontWeight:700, fontSize:13 }}>{r.isInc?fmt(r.amount):""}</td>
                        <td style={{ padding:"9px 13px", color:"#991b1b", fontWeight:700, fontSize:13 }}>{!r.isInc?fmt(r.amount):""}</td>
                        <td style={{ padding:"9px 13px", fontWeight:900, fontSize:13, color: r.running>=0?"#166534":"#991b1b" }}>{fmt(r.running)}</td>
                      </tr>
                    ))}
                  <tr style={{ background:"#f0fdf4", borderTop:"2px solid #1a6b3c" }}>
                    <td colSpan={4} style={{ padding:"12px 13px", fontWeight:900, color:"#1a6b3c" }}>WADARTA</td>
                    <td style={{ padding:"12px 13px", fontWeight:900, color:"#166534" }}>{fmt(totalInc)}</td>
                    <td style={{ padding:"12px 13px", fontWeight:900, color:"#991b1b" }}>{fmt(totalExp)}</td>
                    <td style={{ padding:"12px 13px", fontWeight:900, color: running>=0?"#166534":"#991b1b" }}>{fmt(running)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  REPORTS
    // ══════════════════════════════════════════════════════════
    function ReportsPage({ transactions, activeSchool, notify }) {
      const [tab, setTab] = useState("summary");

      const totalInc = transactions.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount),0);
      const totalExp = transactions.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount),0);

      const byCat = {};
      transactions.forEach(t => {
        if (!byCat[t.category]) byCat[t.category] = { income:0, expense:0 };
        byCat[t.category][t.type] += Number(t.amount);
      });

      const byMonth = {};
      transactions.forEach(t => {
        const k = t.date?.substring(0,7)||"?";
        if (!byMonth[k]) byMonth[k] = { inc:0, exp:0 };
        if (t.type==="income") byMonth[k].inc += Number(t.amount);
        else byMonth[k].exp += Number(t.amount);
      });

      const handlePrint = () => {
        const sc = activeSchool;
        const html = `<html><head><title>Warbixinta · ${sc?.name}</title>
        <style>body{font-family:Arial;margin:28px;font-size:13px;}h1{color:#1a6b3c;text-align:center;}table{width:100%;border-collapse:collapse;margin:16px 0;}th{background:#1a6b3c;color:#fff;padding:9px;}td{padding:8px;border-bottom:1px solid #eee;}.inc{color:#166534;font-weight:700;}.exp{color:#991b1b;font-weight:700;}.tot{background:#f0fdf4;font-weight:800;}</style>
        </head><body>
        <h1>📊 Warbixinta Lacagaha</h1>
        <h2 style="text-align:center">${sc?.name}</h2>
        <p style="text-align:center">La daabacay: ${new Date().toLocaleDateString()}</p>
        <table><tr><th>Qeybta</th><th>Dakhli</th><th>Kharash</th><th>Farqi</th></tr>
        ${Object.entries(byCat).map(([c,d])=>`<tr><td>${c}</td><td class="inc">${fmt(d.income)}</td><td class="exp">${fmt(d.expense)}</td><td style="font-weight:800;color:${d.income-d.expense>=0?"#166534":"#991b1b"}">${fmt(d.income-d.expense)}</td></tr>`).join("")}
        <tr class="tot"><td>WADARTA</td><td class="inc">${fmt(totalInc)}</td><td class="exp">${fmt(totalExp)}</td><td>${fmt(totalInc-totalExp)}</td></tr>
        </table></body></html>`;
        const w = window.open("","_blank"); w.document.write(html); w.document.close(); w.print();
        notify("Warbixinta la daabacayaa ✅");
      };

      return (
        <div>
          <div style={{ display:"flex", gap:8, marginBottom:18, alignItems:"center", flexWrap:"wrap" }}>
            {[["summary","📊 Kooban"],["category","📂 Noocyada"],["monthly","📅 Bisheed"]].map(([id,l]) => (
              <button key={id} onClick={()=>setTab(id)} style={{ padding:"9px 18px", background: tab===id?"#1a6b3c":"#fff", color: tab===id?"#fff":"#374151", border:"1.5px solid #e5e7eb", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>{l}</button>
            ))}
            <div style={{ flex:1 }} />
            <button onClick={handlePrint} style={{ padding:"9px 20px", background:"#7c3aed", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800 }}>🖨️ PDF</button>
          </div>

          {tab==="summary" && (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14 }}>
              {[{l:"Wadarta Dakhliga",v:totalInc,icon:"💰",c:"#166534",bg:"#f0fdf4"},{l:"Wadarta Kharashaadka",v:totalExp,icon:"💸",c:"#991b1b",bg:"#fef2f2"},{l:"Haraaga Guud",v:totalInc-totalExp,icon:"🏦",c:"#1d4ed8",bg:"#eff6ff"}].map((x,i)=>(
                <div key={i} style={{ background:x.bg, borderRadius:14, padding:"24px 20px", textAlign:"center" }}>
                  <div style={{ fontSize:38 }}>{x.icon}</div>
                  <div style={{ fontSize:22, fontWeight:900, color:x.c, margin:"10px 0 4px" }}>{fmt(x.v)}</div>
                  <div style={{ fontSize:13, color:"#64748b" }}>{x.l}</div>
                </div>
              ))}
            </div>
          )}

          {tab==="category" && (
            <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:"#f8fafc" }}>{["Nooca","Dakhli","Kharash","Farqi"].map((h,i)=><th key={i} style={{ padding:"11px 14px", textAlign:"left", fontSize:11, fontWeight:800, color:"#64748b", borderBottom:"1px solid #e5e7eb", textTransform:"uppercase" }}>{h}</th>)}</tr></thead>
                <tbody>
                  {Object.keys(byCat).length===0
                    ? <tr><td colSpan={4} style={{ padding:40, textAlign:"center", color:"#94a3b8" }}>Xog ma jirto</td></tr>
                    : Object.entries(byCat).map(([cat,d])=>(
                      <tr key={cat} style={{ borderBottom:"1px solid #f8fafc" }}>
                        <td style={{ padding:"11px 14px", fontWeight:700 }}>{cat}</td>
                        <td style={{ padding:"11px 14px", color:"#166534", fontWeight:700 }}>{d.income?fmt(d.income):"—"}</td>
                        <td style={{ padding:"11px 14px", color:"#991b1b", fontWeight:700 }}>{d.expense?fmt(d.expense):"—"}</td>
                        <td style={{ padding:"11px 14px", fontWeight:900, color: d.income-d.expense>=0?"#166534":"#991b1b" }}>{fmt(d.income-d.expense)}</td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          )}

          {tab==="monthly" && (
            <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:"#f8fafc" }}>{["Bisha","Dakhli","Kharash","Haraaga"].map((h,i)=><th key={i} style={{ padding:"11px 14px", textAlign:"left", fontSize:11, fontWeight:800, color:"#64748b", borderBottom:"1px solid #e5e7eb", textTransform:"uppercase" }}>{h}</th>)}</tr></thead>
                <tbody>
                  {Object.keys(byMonth).length===0
                    ? <tr><td colSpan={4} style={{ padding:40, textAlign:"center", color:"#94a3b8" }}>Xog ma jirto</td></tr>
                    : Object.entries(byMonth).sort().map(([m,d])=>(
                      <tr key={m} style={{ borderBottom:"1px solid #f8fafc" }}>
                        <td style={{ padding:"11px 14px", fontWeight:700 }}>{m}</td>
                        <td style={{ padding:"11px 14px", color:"#166534", fontWeight:700 }}>{fmt(d.inc)}</td>
                        <td style={{ padding:"11px 14px", color:"#991b1b", fontWeight:700 }}>{fmt(d.exp)}</td>
                        <td style={{ padding:"11px 14px", fontWeight:900, color: d.inc-d.exp>=0?"#166534":"#991b1b" }}>{fmt(d.inc-d.exp)}</td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  LIMITS
    // ══════════════════════════════════════════════════════════
    function LimitsPage({ limits, setLimits, activeSchool, canEdit, notify }) {
      const inputRefs = useRef({});

      const handleSave = (type, cat) => {
        const key = `${type}_${activeSchool?.id}`;
        const refKey = `${type}_${cat}`;
        const val = inputRefs.current[refKey]?.value;
        if (!val || isNaN(val)) return notify("Xaddiga geli si sax ah","error");
        setLimits(prev => { const n = {...prev, [key]: Number(val) }; return n; });
        notify("Xaddiga waa la kaydiyey ✅");
      };

      return (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
          {[{type:"income",label:"💰 Xaddi Dakhliga",cats:INCOME_CATS,color:"#166534",bg:"#f0fdf4"},
            {type:"expense",label:"💸 Xaddi Kharashaadka",cats:EXPENSE_CATS,color:"#991b1b",bg:"#fef2f2"}].map(({type,label,cats,color,bg})=>(
            <div key={type} style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
              <div style={{ padding:"14px 20px", background:bg, borderBottom:"1px solid #e5e7eb" }}>
                <h3 style={{ margin:0, color, fontSize:14, fontWeight:800 }}>{label}</h3>
                <p style={{ margin:"3px 0 0", fontSize:12, color:"#64748b" }}>{activeSchool?.name}</p>
              </div>
              <div style={{ padding:18 }}>
                {cats.map(cat => {
                  const key = `${type}_${activeSchool?.id}`;
                  const refKey = `${type}_${cat}`;
                  const current = limits[key];
                  return (
                    <div key={cat} style={{ marginBottom:14 }}>
                      <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>{cat}</label>
                      <div style={{ display:"flex", gap:8 }}>
                        <input type="number" defaultValue={current||""} placeholder="Xaddi ma leh"
                          ref={el => inputRefs.current[refKey] = el}
                          style={{ flex:1, padding:"8px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                        {canEdit && (
                          <button onClick={() => handleSave(type, cat)}
                            style={{ padding:"8px 14px", background:color, color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:700 }}>💾</button>
                        )}
                      </div>
                      {current && <div style={{ fontSize:11, color:"#94a3b8", marginTop:3 }}>Xaddiga hadda: {fmt(current)}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  SCHOOLS
    // ══════════════════════════════════════════════════════════
    function SchoolsPage({ schools, setSchools, notify }) {
      const [editing,  setEditing]  = useState(null);
      const [showAdd,  setShowAdd]  = useState(false);
      const [form,     setForm]     = useState({ name:"", address:"", phone:"", color:"#1a6b3c", logo:null });

      const handleLogoUpload = (e, setter) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => setter(p => ({ ...p, logo: ev.target.result }));
        reader.readAsDataURL(file);
      };

      const handleAdd = () => {
        if (!form.name) return notify("Magaca iskuulka geli","error");
        setSchools(prev => [...prev, { id:genId(), ...form }]);
        setForm({ name:"", address:"", phone:"", color:"#1a6b3c", logo:null });
        setShowAdd(false);
        notify("Iskuulka cusub waa la geliyey ✅");
      };

      const handleSave = () => {
        setSchools(prev => prev.map(s => s.id===editing.id ? editing : s));
        setEditing(null);
        notify("Iskuulka waa la cusbooneysiiyey ✅");
      };

      const SF = ({ data, setData, onSave, onCancel, label }) => (
        <div style={{ padding:20 }}>
          {[["name","Magaca Iskuulka *"],["address","Cinwaanka"],["phone","Telefoonka"]].map(([k,l]) => (
            <div key={k} style={{ marginBottom:12 }}>
              <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>{l}</label>
              <input value={data[k]||""} onChange={e => setData(p=>({...p,[k]:e.target.value}))}
                style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
            </div>
          ))}
          <div style={{ marginBottom:12 }}>
            <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Midabka</label>
            <input type="color" value={data.color||"#1a6b3c"} onChange={e => setData(p=>({...p,color:e.target.value}))}
              style={{ width:"100%", height:40, border:"1.5px solid #e5e7eb", borderRadius:8, cursor:"pointer" }} />
          </div>
          <div style={{ marginBottom:14 }}>
            <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Logo</label>
            <input type="file" accept="image/*" onChange={e => handleLogoUpload(e, setData)} />
            {data.logo && <img src={data.logo} style={{ width:56, height:56, borderRadius:10, objectFit:"cover", marginTop:8, display:"block" }} />}
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={onSave} style={{ padding:"9px 22px", background:"#1a6b3c", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800 }}>{label}</button>
            <button onClick={onCancel} style={{ padding:"9px 14px", background:"#f1f5f9", color:"#64748b", border:"none", borderRadius:8, cursor:"pointer" }}>Jooji</button>
          </div>
        </div>
      );

      return (
        <div>
          <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:16 }}>
            <button onClick={()=>setShowAdd(true)} style={{ padding:"10px 20px", background:"#1a6b3c", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800 }}>+ Iskuul Cusub</button>
          </div>

          {showAdd && (
            <div style={{ background:"#fff", borderRadius:14, border:"2px solid #1a6b3c33", marginBottom:18 }}>
              <div style={{ padding:"14px 20px", borderBottom:"1px solid #e5e7eb" }}>
                <h3 style={{ margin:0, color:"#1a6b3c", fontSize:15, fontWeight:800 }}>🏫 Iskuul Cusub</h3>
              </div>
              <SF data={form} setData={setForm} onSave={handleAdd} onCancel={()=>setShowAdd(false)} label="✅ Kaydi" />
            </div>
          )}

          <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:16 }}>
            {schools.map(s => (
              <div key={s.id} style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
                <div style={{ background:s.color||"#1a6b3c", padding:"20px", display:"flex", alignItems:"center", gap:14 }}>
                  <div style={{ width:56, height:56, background:"rgba(255,255,255,.2)", borderRadius:12, display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden", flexShrink:0 }}>
                    {s.logo ? <img src={s.logo} style={{ width:56, height:56, objectFit:"cover" }} /> : <span style={{ fontSize:28 }}>🏫</span>}
                  </div>
                  <div>
                    <h3 style={{ margin:0, color:"#fff", fontWeight:900, fontSize:17 }}>{s.name}</h3>
                    <p style={{ margin:"3px 0 0", color:"rgba(255,255,255,.75)", fontSize:12 }}>{s.address||"Cinwaan ma jiro"}</p>
                  </div>
                </div>
                {editing?.id === s.id
                  ? <SF data={editing} setData={setEditing} onSave={handleSave} onCancel={()=>setEditing(null)} label="💾 Xifaali" />
                  : (
                    <div style={{ padding:"13px 18px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontSize:13, color:"#64748b" }}>📞 {s.phone||"—"}</span>
                      <button onClick={()=>setEditing({...s})} style={{ padding:"7px 16px", background:"#eff6ff", color:"#1d4ed8", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13 }}>✏️ Wax Ka Beddel</button>
                    </div>
                  )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    //  USERS
    // ══════════════════════════════════════════════════════════
    function UsersPage({ users, setUsers, schools, notify, currentUser }) {
      const [showAdd, setShowAdd] = useState(false);
      const [form,    setForm]    = useState({ name:"", username:"", password:"", role:"viewer", schoolId:"", active:true });

      const handleAdd = () => {
        if (!form.name||!form.username||!form.password) return notify("Buuxi dhammaan meelaha","error");
        if (users.find(u=>u.username===form.username)) return notify("Username-kaan horaan loo isticmaalay","error");
        setUsers(prev => [...prev, { id:genId(), ...form, schoolId: form.schoolId ? Number(form.schoolId) : null }]);
        setForm({ name:"", username:"", password:"", role:"viewer", schoolId:"", active:true });
        setShowAdd(false);
        notify("Isticmaalaha cusub waa la geliyey ✅");
      };

      const toggleActive = id => {
        setUsers(prev => prev.map(u => u.id===id ? {...u, active:!u.active} : u));
        notify("Xaalada la bedelay ✅");
      };

      const changeRole = (id, role) => {
        setUsers(prev => prev.map(u => u.id===id ? {...u, role} : u));
        notify("Doorka waa la bedelay ✅");
      };

      return (
        <div>
          <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:16 }}>
            <button onClick={()=>setShowAdd(p=>!p)} style={{ padding:"10px 20px", background:"#7c3aed", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800 }}>
              {showAdd ? "✕ Xir" : "+ Isticmaale Cusub"}
            </button>
          </div>

          {showAdd && (
            <div style={{ background:"#fff", borderRadius:14, border:"2px solid #7c3aed22", padding:22, marginBottom:18 }}>
              <h3 style={{ marginBottom:16, color:"#7c3aed", fontSize:15, fontWeight:800 }}>👤 Isticmaale Cusub</h3>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
                {[["name","Magaca Buuxa","text"],["username","Username","text"],["password","Furaha Sirta","password"]].map(([k,l,t])=>(
                  <div key={k}>
                    <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>{l}</label>
                    <input type={t} value={form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}
                      style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }} />
                  </div>
                ))}
                <div>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Doorka</label>
                  <select value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}
                    style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }}>
                    <option value="admin">🔴 Admin</option>
                    <option value="editor">🟡 Editor</option>
                    <option value="viewer">🟢 Viewer</option>
                  </select>
                </div>
                <div>
                  <label style={{ fontSize:12, fontWeight:700, color:"#374151", display:"block", marginBottom:5 }}>Iskuulka</label>
                  <select value={form.schoolId} onChange={e=>setForm(p=>({...p,schoolId:e.target.value}))}
                    style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #e5e7eb", borderRadius:8, fontSize:14, outline:"none" }}>
                    <option value="">Dhammaan Iskuullada</option>
                    {schools.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
              </div>
              <div style={{ display:"flex", gap:10, marginTop:14 }}>
                <button onClick={handleAdd} style={{ padding:"10px 24px", background:"#7c3aed", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:800 }}>✅ Kaydi</button>
                <button onClick={()=>setShowAdd(false)} style={{ padding:"10px 14px", background:"#f1f5f9", color:"#64748b", border:"none", borderRadius:8, cursor:"pointer" }}>Jooji</button>
              </div>
            </div>
          )}

          <div style={{ background:"#fff", borderRadius:14, border:"1px solid #e5e7eb", overflow:"hidden" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:"#f8fafc" }}>
                  {["Magaca","Username","Doorka","Iskuulka","Xaalada","Ficil"].map((h,i)=>(
                    <th key={i} style={{ padding:"11px 14px", textAlign:"left", fontSize:11, fontWeight:800, color:"#64748b", borderBottom:"1px solid #e5e7eb", textTransform:"uppercase" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {users.map(u => {
                  const rc = ROLE_META[u.role]||ROLE_META.viewer;
                  const school = schools.find(s=>s.id===u.schoolId);
